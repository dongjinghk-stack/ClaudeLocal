<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>eMPF QA Executive Dashboard — ET-DAO</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/react-is@18.3.1/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
:root{--font-sans:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:32px;--sidebar-w:260px;--sidebar-collapsed:64px}
[data-theme="light"]{--bg-primary:#fff;--bg-secondary:#f8f9fb;--bg-card:#fff;--text-primary:#0b1726;--text-secondary:#5b6777;--text-muted:#8b95a5;--accent-primary:#0c5c87;--accent-secondary:#1a7ab8;--accent-success:#2e7d32;--accent-warning:#c46b1c;--accent-danger:#c62828;--border:#e6ecf3;--shadow:rgba(10,25,41,.08);--callout-bg:#f0f7fb;--callout-border:#0c5c87;--callout-text:#0b1726;--sidebar-bg:#f3f6fa;--sidebar-hover:#e8edf4}
[data-theme="dark"]{--bg-primary:#0d1117;--bg-secondary:#161b22;--bg-card:#1c2128;--text-primary:#e6edf3;--text-secondary:#8b949e;--text-muted:#6e7681;--accent-primary:#58a6d4;--accent-secondary:#79c0e8;--accent-success:#3fb950;--accent-warning:#d29922;--accent-danger:#f85149;--border:#30363d;--shadow:rgba(0,0,0,.3);--callout-bg:#1e3a4f;--callout-border:#58a6d4;--callout-text:#e6edf3;--sidebar-bg:#161b22;--sidebar-hover:#1c2128}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg-primary);color:var(--text-primary);font-size:14px;transition:background .3s,color .3s}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .3s;overflow:hidden;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar.collapsed{width:var(--sidebar-collapsed)}
.sidebar-header{padding:var(--space-md);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);min-height:64px}
.sidebar-header .logo{height:32px;transition:opacity .3s}
.sidebar.collapsed .logo{opacity:0;width:0}
.sidebar-toggle{background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:20px;padding:4px 8px;border-radius:var(--radius-sm)}
.sidebar-toggle:hover{background:var(--sidebar-hover)}
.sidebar-nav{flex:1;overflow-y:auto;padding:var(--space-sm) 0}
.nav-group-label{padding:12px var(--space-md) 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.nav-group-label .caret{font-size:9px;transition:transform .2s}
.nav-group-label.collapsed .caret{transform:rotate(-90deg)}
.nav-group-items{transition:max-height .25s ease;overflow:hidden}
.nav-group-items.collapsed{max-height:0!important}
.sidebar.collapsed .nav-group-label{display:none}
.biz-kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-md);box-shadow:0 4px 16px var(--shadow);position:relative;overflow:hidden}
.biz-kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent-primary)}
.biz-kpi.green::before{background:var(--accent-success)}
.biz-kpi.amber::before{background:var(--accent-warning)}
.biz-kpi.red::before{background:var(--accent-danger)}
.biz-kpi .v{font-size:24px;font-weight:700;color:var(--text-primary);line-height:1.1}
.biz-kpi .l{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;margin-top:6px}
.biz-kpi .s{font-size:11px;color:var(--text-muted);margin-top:4px}
.biz-kpi .delta{font-size:11px;font-weight:600;margin-top:2px;display:inline-block}
.heatmap-row{display:grid;grid-template-columns:140px 1fr 50px;gap:8px;align-items:center;font-size:12px;padding:4px 0}
.heatmap-cell{height:18px;border-radius:3px}
.lifecycle-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--bg-secondary);font-size:11px;font-weight:600}
.lifecycle-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-primary)}
/* === MBB-style Lifecycle Chevron Flow === */
.lc-banner{display:flex;align-items:center;gap:32px;padding:22px 28px;background:linear-gradient(135deg,#0b1726 0%,#0c5c87 100%);color:#fff;border-radius:var(--radius-md);margin-bottom:20px;position:relative;overflow:hidden}
[data-theme="dark"] .lc-banner{background:linear-gradient(135deg,#1c2128 0%,#1a7ab8 100%)}
.lc-banner::after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.04)}
.lc-banner .num{font-size:44px;font-weight:300;line-height:1;letter-spacing:-1.5px;font-feature-settings:'tnum' 1}
.lc-banner .unit{font-size:18px;opacity:.65;font-weight:400;margin-left:2px}
.lc-banner .sub{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;opacity:.8;font-weight:500;margin-top:4px}
.lc-banner .desc{flex:1;font-size:13px;line-height:1.55;opacity:.9;max-width:480px}
.lc-banner .pill-row{display:flex;gap:6px}
.lc-banner .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(255,255,255,.1);border-radius:4px;font-size:11px;font-weight:600;font-feature-settings:'tnum' 1}
.lc-banner .pill .d{width:8px;height:8px;border-radius:50%}

.lc-flow{display:flex;align-items:stretch;gap:0;padding:50px 4px 30px;overflow-x:auto;overflow-y:visible}
.lc-chev{position:relative;min-width:125px;flex:1;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px 0 26px;transition:all .2s ease;cursor:help;border:none}
.lc-chev:first-child{padding-left:18px;clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%)}
.lc-chev:last-child{padding-right:18px;clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 14px 50%)}
.lc-chev:not(:first-child):not(:last-child){clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%)}
.lc-chev:not(:first-child){margin-left:-12px}
.lc-chev:hover{transform:translateY(-2px);z-index:5;filter:brightness(1.08)}
.lc-chev .ic{font-size:15px;opacity:.85;line-height:1;margin-bottom:3px}
.lc-chev .lbl{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;text-align:center;line-height:1.1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.lc-chev .sc{font-size:18px;font-weight:700;color:#fff;margin-top:3px;line-height:1;font-feature-settings:'tnum' 1}
/* MBB palette: muted, professional */
.lc-chev.green{background:#2c7a4d}
.lc-chev.amber{background:#b8761d}
.lc-chev.red{background:#b5352f}
[data-theme="dark"] .lc-chev.green{background:#3a8560}
[data-theme="dark"] .lc-chev.amber{background:#c28333}
[data-theme="dark"] .lc-chev.red{background:#c74238}

/* Tooltip — MBB clean info card */
.lc-tooltip{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);min-width:260px;max-width:320px;background:#fff;color:#0b1726;border:1px solid #e6ecf3;border-radius:8px;padding:14px 16px;box-shadow:0 12px 32px rgba(11,23,38,.18),0 2px 8px rgba(11,23,38,.08);opacity:0;pointer-events:none;transition:opacity .15s ease;z-index:100;font-size:12px}
[data-theme="dark"] .lc-tooltip{background:#1c2128;color:#e6edf3;border-color:#30363d;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.lc-chev:hover .lc-tooltip{opacity:1}
.lc-tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff}
[data-theme="dark"] .lc-tooltip::after{border-top-color:#1c2128}
.lc-tt-head{display:flex;align-items:center;gap:8px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--border)}
.lc-tt-head .tag{width:8px;height:8px;border-radius:50%}
.lc-tt-head .name{font-size:13px;font-weight:700;letter-spacing:.3px;flex:1}
.lc-tt-head .status{font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:2px 8px;border-radius:3px}
.lc-tt-head .status.green{background:rgba(44,122,77,.12);color:#2c7a4d}
.lc-tt-head .status.amber{background:rgba(184,118,29,.12);color:#b8761d}
.lc-tt-head .status.red{background:rgba(181,53,47,.12);color:#b5352f}
.lc-tt-metric{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:6px}
.lc-tt-nums{display:flex;gap:20px;margin-bottom:10px}
.lc-tt-nums .blk{flex:1}
.lc-tt-nums .v{font-size:22px;font-weight:700;color:var(--text-primary);line-height:1;font-feature-settings:'tnum' 1}
.lc-tt-nums .l{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-top:4px;font-weight:500}
.lc-tt-nums .v.tgt{color:var(--text-secondary);font-weight:500}
.lc-tt-gap{display:inline-block;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:700;font-feature-settings:'tnum' 1}
.lc-tt-gap.pos{background:rgba(44,122,77,.12);color:#2c7a4d}
.lc-tt-gap.neg{background:rgba(181,53,47,.12);color:#b5352f}
.lc-tt-detail{font-size:11.5px;color:var(--text-secondary);line-height:1.55;padding-top:10px;border-top:1px solid var(--border);margin-top:2px}

.lc-progress{height:3px;background:rgba(255,255,255,.22);border-radius:2px;margin-top:6px;overflow:hidden;width:60%}
.lc-progress .f{height:100%;background:#fff;border-radius:2px;transition:width .6s ease}

.lc-legend{display:flex;align-items:center;gap:20px;font-size:11px;color:var(--text-secondary);margin-top:12px;flex-wrap:wrap;padding:0 4px}
.lc-legend .sw{width:12px;height:3px;border-radius:1px;display:inline-block;margin-right:6px;vertical-align:middle}
.lc-legend .note{margin-left:auto;font-style:italic;color:var(--text-muted);font-size:10.5px}
.sidebar.collapsed .nav-group-label{display:none}
.nav-item{display:flex;align-items:center;gap:var(--space-sm);padding:10px var(--space-md);cursor:pointer;color:var(--text-secondary);transition:all .2s;border-left:3px solid transparent;white-space:nowrap;font-size:13px}
.nav-item:hover{background:var(--sidebar-hover);color:var(--text-primary)}
.nav-item.active{color:var(--accent-primary);border-left-color:var(--accent-primary);background:var(--sidebar-hover);font-weight:600}
.nav-item .icon{font-size:18px;min-width:24px;text-align:center}
.sidebar.collapsed .nav-item .label{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding-left:0;padding-right:0}
.main{flex:1;margin-left:var(--sidebar-w);transition:margin-left .3s;min-width:0}
.sidebar.collapsed~.main{margin-left:var(--sidebar-collapsed)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) var(--space-lg);border-bottom:1px solid var(--border);background:var(--bg-primary);position:sticky;top:0;z-index:50}
.topbar .brand{font-size:18px;font-weight:700;color:var(--accent-primary)}
.theme-toggle{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--bg-secondary);cursor:pointer;font-size:18px}
.content{padding:var(--space-lg);max-width:1400px;margin:0 auto}
.section-title{font-size:22px;font-weight:600;margin-bottom:var(--space-lg);padding-bottom:var(--space-sm);border-bottom:2px solid var(--accent-primary);display:inline-block}
.subsection{margin-top:var(--space-xl)}
.subsection h3{font-size:16px;font-weight:600;margin-bottom:var(--space-md)}
.grid{display:grid;gap:var(--space-md)}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-md);box-shadow:0 4px 16px var(--shadow);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--shadow)}
.card h3{font-size:14px;font-weight:600;margin-bottom:var(--space-md);color:var(--text-primary)}
.kpi-card{text-align:center;padding:var(--space-lg)}
.kpi-value{font-size:28px;font-weight:700;color:var(--accent-primary)}
.kpi-label{font-size:11px;font-weight:500;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.kpi-sub{font-size:12px;color:var(--text-secondary);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg-secondary);padding:10px 12px;text-align:left;font-weight:600;color:var(--text-secondary);border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0;z-index:1}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--bg-secondary)}
.rag{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.rag-green{background:var(--accent-success)}.rag-amber{background:var(--accent-warning)}.rag-red{background:var(--accent-danger)}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-green{background:rgba(46,125,50,.12);color:var(--accent-success)}
.badge-amber{background:rgba(196,107,28,.12);color:var(--accent-warning)}
.badge-red{background:rgba(198,40,40,.12);color:var(--accent-danger)}
.badge-blue{background:rgba(26,122,184,.12);color:var(--accent-secondary)}
.badge-gray{background:rgba(91,103,119,.12);color:var(--text-secondary)}
.progress-bar{height:8px;background:var(--bg-secondary);border-radius:4px;overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:4px;transition:width .6s ease}
.callout{background:var(--callout-bg);border:2px solid var(--callout-border);border-radius:var(--radius-md);padding:var(--space-lg);color:var(--callout-text);margin-top:var(--space-lg)}
.callout h3{margin-bottom:var(--space-sm);font-size:15px}
.tbl-wrap{max-height:600px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-primary);font-size:13px;min-width:130px}
.pagination{display:flex;gap:6px;justify-content:center;margin-top:12px;align-items:center;font-size:13px}
.pagination button{padding:6px 10px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);border-radius:var(--radius-sm);cursor:pointer}
.pagination button:disabled{opacity:.4}
.pflow{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;overflow-x:auto;margin-bottom:16px;box-shadow:0 4px 16px var(--shadow)}
.pflow-phases{display:flex;align-items:center;margin-bottom:16px;min-width:900px}
.phase{display:flex;flex-direction:column;align-items:center;flex:1}
.phase-circle{width:50px;height:50px;border-radius:50%;border:3px solid var(--accent-success);display:flex;align-items:center;justify-content:center;background:var(--bg-card);font-size:20px}
.phase-circle.inactive{border-color:var(--text-muted);opacity:.5}
.phase-label{font-size:11px;color:var(--text-secondary);margin-top:6px;font-weight:500}
.phase-arrow{flex:0 0 36px;color:var(--text-muted);font-size:18px;text-align:center}
.pflow-cards{display:flex;min-width:900px}
.pcard-slot{flex:1;display:flex;flex-direction:column;gap:6px}
.pcard{background:var(--bg-card);border:1px solid var(--border);border-top:4px solid var(--accent-primary);border-radius:4px;padding:8px;font-size:11px;box-shadow:0 2px 6px var(--shadow)}
.pcard-id{font-family:monospace;font-size:10px;color:var(--accent-primary);margin-bottom:3px}
.pcard-title{font-weight:600;font-size:11px;margin-bottom:3px}
.pcard-meta{font-size:10px;color:var(--text-secondary);white-space:pre-line;line-height:1.4}
.pcard.kb{border-top-color:var(--accent-warning)}
.arrow-slot{flex:0 0 36px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);padding-top:22px}
.empty{color:var(--text-muted);font-size:11px;padding:6px;text-align:center;border:1px dashed var(--border);border-radius:4px}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.kcol{flex:0 0 260px;background:var(--bg-secondary);border-radius:var(--radius-md);padding:10px;border-top:4px solid var(--accent-primary)}
.kcol h4{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between}
.kcol .cnt{background:var(--accent-primary);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px}
.kitem{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;margin-bottom:8px;font-size:12px;box-shadow:0 2px 4px var(--shadow);cursor:pointer}
.kitem .kid{font-family:monospace;font-size:10px;color:var(--accent-primary)}
.kitem .ktit{font-weight:600;margin:3px 0;font-size:12px}
.sprint-sel{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.sprint-sel button{padding:6px 12px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);border-radius:var(--radius-sm);cursor:pointer;font-size:12px}
.sprint-sel button.active{background:var(--accent-primary);color:#fff;border-color:var(--accent-primary)}
.mod-health-row{display:grid;grid-template-columns:190px 50px 1fr 60px 55px;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--border);font-size:12px}
.mod-health-row:hover{background:var(--bg-secondary)}
.mod-name{font-weight:600;font-size:13px}
.exec-hero{background:linear-gradient(135deg,#0b1726 0%,#0c5c87 100%);color:#fff;border-radius:var(--radius-md);padding:24px 28px;margin-bottom:20px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:24px}
[data-theme="dark"] .exec-hero{background:linear-gradient(135deg,#1c2128 0%,#1a7ab8 100%)}
.exec-hero .blk{border-left:1px solid rgba(255,255,255,.18);padding-left:18px}
.exec-hero .blk:first-child{border-left:none;padding-left:0}
.exec-hero .v{font-size:32px;font-weight:300;line-height:1;letter-spacing:-1px}
.exec-hero .u{font-size:14px;opacity:.65;margin-left:2px;font-weight:400}
.exec-hero .l{font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.8;font-weight:500;margin-top:6px}
.exec-hero .s{font-size:11px;opacity:.78;margin-top:6px;line-height:1.4}
.exec-hero .d{font-size:11px;font-weight:600;margin-top:4px}
.exec-hero .d.up{color:#7ed4a3}
.exec-hero .d.down{color:#f0a8a3}
.mini-kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;position:relative;overflow:hidden}
.mini-kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-primary)}
.mini-kpi.green::before{background:#2c7a4d}
.mini-kpi.amber::before{background:#b8761d}
.mini-kpi.red::before{background:#b5352f}
.mini-kpi .v{font-size:22px;font-weight:700;color:var(--text-primary);line-height:1.1}
.mini-kpi .l{font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;font-weight:600}
.mini-kpi .s{font-size:11px;color:var(--text-muted);margin-top:4px}
.pledge-row{display:grid;grid-template-columns:1.3fr 90px 1fr 60px 60px;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);font-size:12.5px}
.pledge-row:last-child{border-bottom:none}
.pledge-row:hover{background:var(--bg-secondary)}
.pledge-row .pname{font-weight:600;color:var(--text-primary);font-size:13px}
.pledge-row .psub{font-size:10.5px;color:var(--text-muted);margin-top:2px}
.pledge-row .ptarget{color:var(--text-secondary);font-size:11px;text-align:right}
.pledge-bar{height:10px;background:var(--bg-secondary);border-radius:5px;overflow:hidden;position:relative}
.pledge-bar .fill{height:100%;border-radius:5px;transition:width .6s}

<script>
/* ===== QA Dashboard render module (merged from qa_dashboard.html) =====
   Exposes window.QA = { render(section, week, lang), WEEKS, WEEK_DATES, NAV_ITEMS }
   Returns an HTML string for the given dev section/week. Used by <DevDashboard> below. */
(function(){
  if(typeof DASHBOARD_DATA==='undefined'){window.QA={render:function(){return '<div style="padding:40px;color:var(--accent-danger)">data_QA.js failed to load.</div>';},WEEKS:[],WEEK_DATES:{},NAV_ITEMS:[]};return;}
  const D=DASHBOARD_DATA;
  const WEEKS=['W14','W15','W16','W17','W18','W19','W20','W21','W22','W23','W24','W25','W26','W27','W28','W29','W30','W31','W32','W33'];
  const WEEK_DATES={W14:'Feb 09, 2026',W15:'Feb 16, 2026',W16:'Feb 23, 2026',W17:'Mar 02, 2026',W18:'Mar 09, 2026',W19:'Mar 16, 2026',W20:'Mar 23, 2026',W21:'Mar 30, 2026',W22:'Apr 06, 2026',W23:'Apr 13, 2026',W24:'Apr 20, 2026',W25:'Apr 27, 2026',W26:'May 04, 2026',W27:'May 11, 2026',W28:'May 18, 2026',W29:'May 25, 2026',W30:'Jun 01, 2026',W31:'Jun 08, 2026',W32:'Jun 15, 2026',W33:'Jun 22, 2026'};
  const NAV_ITEMS=[
    {icon:'📊',en:'Dashboard',zh:'仪表板'},
    {icon:'📋',en:'Functional Testing — SIT',zh:'功能测试 — SIT'},
    {icon:'📦',en:'Data Migration',zh:'数据迁移'},
    {icon:'⚡',en:'Performance Testing',zh:'性能测试'},
    {icon:'🔒',en:'Security Testing',zh:'安全测试'},
    {icon:'🔄',en:'Regression & Automation',zh:'回归与自动化'},
    {icon:'✅',en:'UAT',zh:'用户验收测试'},
    {icon:'🛡️',en:'DR / Business Continuity',zh:'灾难恢复/业务连续性'},
    {icon:'📜',en:'Compliance',zh:'合规测试'},
    {icon:'🚀',en:'Go-Live Readiness',zh:'上线就绪度'},
    {icon:'🏦',en:'Trustee Onboarding Status',zh:'受托人入驻状态'}
  ];
  let currentWeek='W22',currentLang='en';

  /* Helpers */
  const T=(en,zh)=>currentLang==='en'?en:zh;
  const ragClass=s=>s==='green'?'rag-green':s==='amber'?'rag-amber':'rag-red';
  const badgeClass=s=>s==='green'||s==='Resolved'||s==='Pass'||s==='On Track'||s==='Signed Off'?'badge-green':s==='amber'||s==='In Progress'||s==='Conditional Pass'?'badge-amber':s==='red'||s==='Open'||s==='Fail'||s==='Not Started'?'badge-red':'badge-gray';
  const pct=v=>(v||0).toFixed(1)+'%';
  const ragDot=s=>`<span class="rag ${ragClass(s)}"></span>`;
  const badge=(text,cls)=>`<span class="badge ${cls||badgeClass(text)}">${text}</span>`;
  const progressBar=(val,color)=>`<div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,val)}%;background:${color||'var(--accent-primary)'}"></div></div>`;
  function kpiCard(value,label,sub,color){return `<div class="card kpi-card"><div class="kpi-value" style="${color?'color:'+color:''}">${value}</div><div class="kpi-label">${label}</div>${sub?'<div class="kpi-sub">'+sub+'</div>':''}</div>`;}
  function makeTable(headers,rows){return `<div class="card" style="overflow-x:auto"><table><thead><tr>${headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`;}
  function calloutBox(title,items){return `<div class="callout"><h3>💡 ${title}</h3><ul>${items.map(i=>'<li>'+i+'</li>').join('')}</ul></div>`;}
  function lineChart(data,w,h,labels){
    if(!data||!data.length)return'';
    const pad={t:20,r:20,b:40,l:40};const cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
    const maxV=Math.max(...data.flatMap(s=>s.values))*1.1;
    let svg=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
    for(let i=0;i<=4;i++){const y=pad.t+ch-ch*i/4;const v=Math.round(maxV*i/4);svg+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="var(--border)" stroke-dasharray="4"/><text x="${pad.l-5}" y="${y+4}" text-anchor="end" font-size="10">${v}</text>`}
    if(labels)labels.forEach((l,i)=>{const x=pad.l+cw*i/(labels.length-1);if(i%2===0)svg+=`<text x="${x}" y="${h-5}" text-anchor="middle" font-size="9">${l}</text>`});
    data.forEach(series=>{const pts=series.values.map((v,i)=>{const x=pad.l+cw*i/(series.values.length-1);const y=pad.t+ch-ch*v/maxV;return `${x},${y}`}).join(' ');svg+=`<polyline points="${pts}" fill="none" stroke="${series.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;series.values.forEach((v,i)=>{const x=pad.l+cw*i/(series.values.length-1);const y=pad.t+ch-ch*v/maxV;svg+=`<circle cx="${x}" cy="${y}" r="3" fill="${series.color}" stroke="var(--bg-card)" stroke-width="1.5"/>`})});
    svg+=`</svg>`;return svg;
  }
  function renderReadinessChart(){
    const trend=D.readinessTrend;const planned=trend.planned;const actual=trend.actual;const tgt=trend.target;
    const W=1100,H=150;const pad={t:12,r:45,b:28,l:42};const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
    const allWeeks=planned.map(p=>p.week);const weekCount=allWeeks.length;
    function x(i){return pad.l+cw*i/(weekCount-1)}
    function y(v){return pad.t+ch-ch*v/100}
    let svg=`<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="overflow:visible">`;
    for(let v=0;v<=100;v+=25)svg+=`<line x1="${pad.l}" y1="${y(v)}" x2="${W-pad.r}" y2="${y(v)}" stroke="var(--border)" stroke-dasharray="4" opacity="0.6"/><text x="${pad.l-6}" y="${y(v)+4}" text-anchor="end" font-size="9" fill="var(--text-muted)">${v}%</text>`;
    svg+=`<line x1="${pad.l}" y1="${y(tgt)}" x2="${W-pad.r}" y2="${y(tgt)}" stroke="var(--accent-success)" stroke-dasharray="6,3" stroke-width="1.5" opacity="0.5"/><text x="${W-pad.r+4}" y="${y(tgt)+4}" font-size="8" fill="var(--accent-success)" font-weight="600">${tgt}%</text>`;
    allWeeks.forEach((w,i)=>{const wNum=parseInt(w.slice(1));if(wNum%4===0||i===0||i===weekCount-1)svg+=`<text x="${x(i)}" y="${H-4}" text-anchor="middle" font-size="8" fill="var(--text-muted)">${w}</text>`});
    const glIdx=allWeeks.indexOf('W48');
    if(glIdx>=0)svg+=`<line x1="${x(glIdx)}" y1="${pad.t}" x2="${x(glIdx)}" y2="${H-pad.b}" stroke="var(--accent-danger)" stroke-dasharray="3,3" opacity="0.5" stroke-width="1.5"/><text x="${x(glIdx)}" y="${pad.t-2}" text-anchor="middle" font-size="8" fill="var(--accent-danger)" font-weight="600">Go-Live</text>`;
    const cwi=WEEKS.indexOf(currentWeek);const actEndIdx=cwi>=0?cwi:actual.length-1;
    if(actEndIdx>=0){let fillPts=`${x(0)},${y(0)}`;for(let i=0;i<=actEndIdx;i++)fillPts+=` ${x(i)},${y(actual[i].value)}`;fillPts+=` ${x(actEndIdx)},${y(0)}`;svg+=`<polygon points="${fillPts}" fill="var(--chart-fill,rgba(12,92,135,0.08))" opacity="0.6"/>`}
    const plannedPts=planned.map((p,i)=>`${x(i)},${y(p.value)}`).join(' ');
    svg+=`<polyline points="${plannedPts}" fill="none" stroke="var(--chart-planned,var(--accent-secondary))" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>`;
    if(actEndIdx>=0){
      const actPts=[];for(let i=0;i<=actEndIdx;i++)actPts.push(`${x(i)},${y(actual[i].value)}`);
      svg+=`<polyline points="${actPts.join(' ')}" fill="none" stroke="var(--chart-actual,var(--accent-primary))" stroke-width="2.5" stroke-linecap="round"/>`;
      if(actEndIdx<weekCount-1){
        const lastAct=actual[actEndIdx].value;const projTarget=planned[weekCount-1].value*0.95;
        const projPts=[`${x(actEndIdx)},${y(lastAct)}`];
        for(let i=actEndIdx+1;i<weekCount;i++){const prog=(i-actEndIdx)/(weekCount-1-actEndIdx);const projVal=lastAct+(projTarget-lastAct)*prog;projPts.push(`${x(i)},${y(projVal)}`)}
        svg+=`<polyline points="${projPts.join(' ')}" fill="none" stroke="var(--chart-actual,var(--accent-primary))" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>`;
      }
      svg+=`<circle cx="${x(actEndIdx)}" cy="${y(actual[actEndIdx].value)}" r="5" fill="var(--chart-actual,var(--accent-primary))" stroke="var(--bg-card)" stroke-width="2"/>`;
    }
    svg+=`</svg>`;
    return `<div class="card readiness-chart-card"><h3>${T('Readiness Trend','就绪度趋势')}</h3><div class="readiness-chart-legend"><span><svg width="20" height="2"><line x1="0" y1="1" x2="20" y2="1" stroke="var(--accent-secondary)" stroke-width="2" stroke-dasharray="4,2"/></svg> ${T('Planned','计划')}</span><span><svg width="20" height="2"><line x1="0" y1="1" x2="20" y2="1" stroke="var(--accent-primary)" stroke-width="2.5"/></svg> ${T('Actual','实际')}</span><span><svg width="20" height="2"><line x1="0" y1="1" x2="20" y2="1" stroke="var(--accent-success)" stroke-width="1.5" stroke-dasharray="4,2"/></svg> ${T('Target 95%','目标95%')}</span></div>${svg}</div>`;
  }

  /* Tab renderers */
  function renderDashboard(){
    const ps=D.projectSummary[currentWeek]||D.projectSummary.W22;
    const dh=D.domainHealth[currentWeek]||[];
    const df=D.defectTrend14d[currentWeek]||[];
    const kr=D.keyRisksActions[currentWeek];
    const weekNum=ps.weekNumber;
    const prevWeek=WEEKS[Math.max(0,WEEKS.indexOf(currentWeek)-1)];
    const prevPs=D.projectSummary[prevWeek];
    const progressDelta=prevPs?Math.abs(ps.readinessScore-prevPs.readinessScore).toFixed(1):'—';
    const phaseData=[
      {en:'SIT Execution',zh:'SIT执行',start:14,end:19},
      {en:'SIT Complete & Perf',zh:'SIT完成与性能',start:20,end:25},
      {en:'Pre-UAT',zh:'UAT前准备',start:26,end:29},
      {en:'UAT Execution',zh:'UAT执行',start:30,end:37},
      {en:'Pre Go-Live',zh:'上线前准备',start:38,end:44},
      {en:'Cutover',zh:'切换',start:45,end:48}
    ];
    let html=`<h2 class="section-title">${T('Executive Dashboard','执行仪表板')}</h2>`;
    html+=`<div class="timeline">${phaseData.map(p=>`<div class="timeline-phase${weekNum>=p.start&&weekNum<=p.end?' current':weekNum>p.end?' done':''}">${T(p.en,p.zh)}</div>`).join('')}</div>`;
    html+=`<div class="grid grid-5">
      ${kpiCard(ps.readinessScore.toFixed(1)+'%',T('Readiness','就绪度'),'',ps.readinessScore>=70?'var(--accent-success)':ps.readinessScore>=50?'var(--accent-warning)':'var(--accent-danger)')}

  function renderGoLive(){

    html+=`<div style="margin-top:var(--space-md)">${renderReadinessChart()}</div>`;

    const gR=gl.map(g=>[T(g.gate,g.gateZh),g.target,g.current,ragDot(g.status)+badge(g.status.toUpperCase(),badgeClass(g.status))]);

      {name:'BEA Trustees',nameZh:'东亚银行受托人',aum:32,date:'Nov 2024',status:'Onboarded',members:120000},
      {name:'Sun Life Trustees',nameZh:'永明金融受托人',aum:45,date:'Oct 03, 2025',status:'Onboarded',members:280000},

      {name:'AIA Trustees',nameZh:'友邦受托人',aum:120,date:'Nov 2025',status:'Onboarded',members:680000},
      {name:'BCT Trustees',nameZh:'银联受托人',aum:95,date:'Dec 2025',status:'Onboarded',members:450000},
      {name:'BOCI-Prudential',nameZh:'中银保诚受托人',aum:135,date:'Jan 2026',status:'Onboarded',members:720000},
      {name:'HSBC Provident Fund',nameZh:'汇丰公积金',aum:280,date:'Jan 29, 2026',status:'Onboarded',members:950000},
      {name:'Hang Seng Trustees',nameZh:'恒生受托人',aum:195,date:'Jan 29, 2026',status:'Onboarded',members:610000},

      {en:'Phase 5: Final trustee (BEA Industry Scheme) — Apr 30, 2026',zh:'阶段5: 最终受托人 (东亚行业计划) — 2026年4月30日',done:weekNum>=26},

    ];
    html+=calloutBox(T('Onboarding Milestones','入驻里程碑'),milestones.map(m=>`${m.done?'✅':'⏳'} ${T(m.en,m.zh)}`));
    return html;
  }

  const RENDERERS=[renderDashboard,renderSIT,renderMigration,renderPerf,renderSecurity,renderRegression,renderUAT,renderDR,renderCompliance,renderGoLive,renderTrusteeOnboarding];
  window.QA={
    WEEKS:WEEKS,
    WEEK_DATES:WEEK_DATES,
    NAV_ITEMS:NAV_ITEMS,
    render:function(section,week,lang){
      currentWeek=(week&&WEEKS.indexOf(week)>=0)?week:'W22';
      currentLang=(lang==='zh')?'zh':'en';
      const idx=(typeof section==='number'&&section>=0&&section<RENDERERS.length)?section:0;
      try{return RENDERERS[idx]();}catch(e){return `<div class="card" style="padding:var(--space-xl);color:var(--accent-danger)"><strong>QA render error:</strong> ${e.message}</div>`;}
    }
  };
})();
</script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,createElement}=React;
const RC=window.Recharts;
const HAS_RC=!!RC;
const Stub=({children,...p})=>React.createElement('div',{style:{padding:20,textAlign:'center',color:'#888',fontSize:12,border:'1px dashed #ccc',borderRadius:6}},'Chart library not loaded');
const BarChart=HAS_RC?RC.BarChart:Stub,Bar=HAS_RC?RC.Bar:Stub,LineChart=HAS_RC?RC.LineChart:Stub,Line=HAS_RC?RC.Line:Stub,PieChart=HAS_RC?RC.PieChart:Stub,Pie=HAS_RC?RC.Pie:Stub,Cell=HAS_RC?RC.Cell:Stub,XAxis=HAS_RC?RC.XAxis:Stub,YAxis=HAS_RC?RC.YAxis:Stub,CartesianGrid=HAS_RC?RC.CartesianGrid:Stub,Tooltip=HAS_RC?RC.Tooltip:Stub,Legend=HAS_RC?RC.Legend:Stub,ResponsiveContainer=HAS_RC?RC.ResponsiveContainer:Stub,AreaChart=HAS_RC?RC.AreaChart:Stub,Area=HAS_RC?RC.Area:Stub,ReferenceLine=HAS_RC?RC.ReferenceLine:Stub,ComposedChart=HAS_RC?RC.ComposedChart:Stub;
const D=window.__DATA__||{incidents:[],problems:[],kbs:[],bugs:[],testcases:[]};
// Pre-index by system_module for O(1) lookup at scale (10k+ rows)
const _byMod=(arr,key='system_module')=>{const m={};MODULES.forEach(x=>m[x]=[]);arr.forEach(r=>{const k=r[key];if(m[k])m[k].push(r);});return m;};
const IDX={inc:null,prb:null,bug:null,tc:null};
const COLORS=['#0c5c87','#1a7ab8','#2e7d32','#c46b1c','#c62828','#6e4c9e','#00838f','#558b2f'];
const MODULES=['ACCT-CONSOL','API-GATEWAY','AUTH-IAM','BATCH-PROC','CLAIM-PROC','CONTRIB-ENGINE','DATA-PLATFORM','DOC-MGMT','EMP-PORTAL','FUND-MGMT','INFRA','MBR-PORTAL','NOTIF-SVC','RPT-ANALYTICS','TRS-GATEWAY'];
const MOD_LABEL={'MBR-PORTAL':'Member Portal','EMP-PORTAL':'Empotre Portal','TRS-GATEWAY':'Trustee Gateway','CONTRIB-ENGINE':'Contribution Engine','FUND-MGMT':'Fund Management','CLAIM-PROC':'Claim Processing','ACCT-CONSOL':'Account Consolidation','NOTIF-SVC':'Notification Services','RPT-ANALYTICS':'Report & Analysis','AUTH-IAM':'Authentication & IAM','DOC-MGMT':'Document Management','BATCH-PROC':'Batch Processing','API-GATEWAY':'API Gateway','DATA-PLATFORM':'Data Platform','INFRA':'Infrastructure'};
const ml=k=>MOD_LABEL[k]||k||'—';
const splitIds=s=>!s?[]:String(s).split('|').filter(Boolean);
const fmtDate=d=>!d?'—':String(d).slice(0,10);
const monthOf=d=>!d?null:String(d).slice(0,7);
const ragColor=s=>s>=80?'var(--accent-success)':s>=60?'var(--accent-warning)':'var(--accent-danger)';
const ragClass=s=>s>=80?'green':s>=60?'amber':'red';
const Badge=({v,cls})=>!v?null:<span className={`badge ${cls||'badge-gray'}`}>{v}</span>;
const sevClass=v=>({S1_CRITICAL:'badge-red',S2_HIGH:'badge-amber',S3_MEDIUM:'badge-blue',S4_LOW:'badge-gray'})[v]||'badge-gray';
const priClass=v=>({P1:'badge-red',P2:'badge-amber',P3:'badge-blue',P4:'badge-gray'})[v]||'badge-gray';
const statClass=v=>['RESOLVED','CLOSED','FIXED','PASS','ACTIVE','VERIFIED'].includes(v)?'badge-green':['OPEN','REOPENED','FAIL'].includes(v)?'badge-red':'badge-amber';

function DateCell({value,onChange}){const [e,setE]=useState(false);const [v,setV]=useState(fmtDate(value));if(e)return <input type="date" value={v} autoFocus onBlur={()=>{setE(false);onChange&&onChange(v);}} onChange={x=>setV(x.target.value)} style={{padding:'2px 4px',fontSize:12}}/>;return <span onClick={x=>{x.stopPropagation();setE(true);}} style={{cursor:'pointer',borderBottom:'1px dashed var(--text-muted)'}}>{fmtDate(value)}</span>;}
function StatusCell({value,options,onChange}){return <select value={value||''} onClick={e=>e.stopPropagation()} onChange={e=>{e.stopPropagation();onChange&&onChange(e.target.value);}} style={{padding:'3px 6px',fontSize:12,border:'1px solid var(--border)',background:'var(--bg-card)',color:'var(--text-primary)',borderRadius:4}}>{options.map(o=><option key={o} value={o}>{o}</option>)}</select>;}

function DataTable({rows,cols,onRowClick,pageSize=12}){const [q,setQ]=useState('');const [page,setPage]=useState(0);const [f,setF]=useState({});const [data,setData]=useState(rows);useEffect(()=>{setData(rows);setPage(0);},[rows]);const filtered=useMemo(()=>data.filter(r=>{if(q&&!JSON.stringify(r).toLowerCase().includes(q.toLowerCase()))return false;for(const k in f)if(f[k]&&r[k]!==f[k])return false;return true;}),[data,q,f]);const pages=Math.ceil(filtered.length/pageSize);const paged=filtered.slice(page*pageSize,(page+1)*pageSize);const filterable=cols.filter(c=>c.filter);return <div><div className="filters"><input placeholder="🔍 Search all fields..." value={q} onChange={e=>setQ(e.target.value)} style={{flex:1,minWidth:220}}/>{filterable.map(c=>{const opts=[...new Set(data.map(r=>r[c.key]).filter(Boolean))].sort();return <select key={c.key} value={f[c.key]||''} onChange={e=>setF({...f,[c.key]:e.target.value})}><option value="">All {c.label}</option>{opts.map(o=><option key={o} value={o}>{c.key==='system_module'?ml(o):o}</option>)}</select>;})}</div><div className="tbl-wrap"><table><thead><tr>{cols.map(c=><th key={c.key}>{c.label}</th>)}</tr></thead><tbody>{paged.map((r,i)=><tr key={i} onClick={()=>onRowClick&&onRowClick(r)} style={{cursor:onRowClick?'pointer':''}}>{cols.map(c=><td key={c.key}>{c.render?c.render(r,nr=>setData(data.map(x=>x===r?nr:x))):(r[c.key]==null?'—':String(r[c.key]))}</td>)}</tr>)}{!paged.length&&<tr><td colSpan={cols.length} style={{textAlign:'center',padding:24,color:'var(--text-muted)'}}>No records</td></tr>}</tbody></table></div><div className="pagination"><button onClick={()=>setPage(0)} disabled={page===0}>«</button><button onClick={()=>setPage(p=>Math.max(0,p-1))} disabled={page===0}>‹</button><span>Page {page+1}/{Math.max(1,pages)} · {filtered.length} records</span><button onClick={()=>setPage(p=>Math.min(pages-1,p+1))} disabled={page>=pages-1}>›</button><button onClick={()=>setPage(pages-1)} disabled={page>=pages-1}>»</button></div></div>;}

function ProcessFlow({anchor,anchorType}){let incident=null,problem=null,bug=null,testcases=[],kbs=[];if(anchorType==='bug'){bug=anchor;incident=D.incidents.find(i=>i.incident_id===bug.primary_incident_id);problem=D.problems.find(p=>p.problem_id===bug.primary_problem_id);testcases=D.testcases.filter(t=>t.source_bug_id===bug.bug_id);kbs=D.kbs.filter(k=>splitIds(bug.related_kb_article_ids).includes(k.kb_id));}else if(anchorType==='testcase'){const tc=anchor;testcases=[tc];bug=D.bugs.find(b=>b.bug_id===tc.source_bug_id);if(bug){incident=D.incidents.find(i=>i.incident_id===bug.primary_incident_id);problem=D.problems.find(p=>p.problem_id===bug.primary_problem_id);kbs=D.kbs.filter(k=>splitIds(bug.related_kb_article_ids).includes(k.kb_id));}}const phases=[{ic:'⚠️',l:'Incident',a:!!incident},{ic:'📋',l:'Problem',a:!!problem},{ic:'📚',l:'Knowledge Base',a:kbs.length>0},{ic:'🐞',l:'Bug Fix',a:!!bug},{ic:'✅',l:'Retest',a:testcases.length>0}];const Card=({o,f,cls=''})=>o?<div className={`pcard ${cls}`}><div className="pcard-id">{o[f.id]}</div><div className="pcard-title">{(o[f.title]||'').slice(0,55)}</div><div className="pcard-meta">{f.meta(o)}</div></div>:<div className="empty">No record</div>;return <div className="pflow"><h3 style={{marginBottom:14}}>🔄 Traceability Flow</h3><div className="pflow-phases">{phases.map((p,i)=><React.Fragment key={i}><div className="phase"><div className={`phase-circle ${!p.a?'inactive':''}`}>{p.ic}</div><div className="phase-label">{p.l}</div></div>{(phases.length>i+1)&&<div className="phase-arrow">»»</div>}</React.Fragment>)}</div><div className="pflow-cards"><div className="pcard-slot"><Card o={incident} f={{id:'incident_id',title:'title',meta:o=>`Module: ${ml(o.system_module)}\nCreated: ${fmtDate(o.created_date)}\nSeverity: ${o.severity||'—'}`}}/></div><div className="arrow-slot">»»</div><div className="pcard-slot"><Card o={problem} f={{id:'problem_id',title:'title',meta:o=>`Priority: ${o.priority}\nCreated: ${fmtDate(o.created_date)}\nResolved: ${fmtDate(o.resolved_date)}`}}/></div><div className="arrow-slot">»»</div><div className="pcard-slot">{kbs.length?kbs.slice(0,3).map(k=><div key={k.kb_id} className="pcard kb"><div className="pcard-id">{k.kb_id}</div><div className="pcard-title">{(k.title||'').slice(0,45)}</div><div className="pcard-meta">Used: {k.usage_count}× · Eff: {k.effectiveness_score}</div></div>):<div className="empty">No KB used</div>}</div><div className="arrow-slot">»»</div><div className="pcard-slot"><Card o={bug} f={{id:'bug_id',title:'title',meta:o=>`Severity: ${o.severity}\nAssigned: ${o.assigned_to}\nFixed: ${fmtDate(o.fix_verified_date)}`}}/></div><div className="arrow-slot">»»</div><div className="pcard-slot">{testcases.length?testcases.slice(0,3).map(t=><div key={t.testcase_id} className="pcard"><div className="pcard-id">{t.testcase_id}</div><div className="pcard-title">{(t.title||'').slice(0,45)}</div><div className="pcard-meta">Type: {t.test_type}{'\n'}Exec: {fmtDate(t.execution_date)}{'\n'}Result: {t.test_result||'—'}</div></div>):<div className="empty">No retest</div>}</div></div></div>;}
