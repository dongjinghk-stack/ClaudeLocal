/* ===== MODULE HEALTH COMPUTATION ===== */
/* Week helpers — W1 = 2026-01-01..2026-01-07, WN ends at Jan1+7N days */
const YEAR_START=new Date('2026-01-01T00:00:00');
const TODAY=new Date('2026-04-12T23:59:59');
const CURRENT_WEEK=Math.min(52,Math.max(1,Math.ceil((TODAY-YEAR_START)/(7*86400000))));
const weekEnd=n=>new Date(YEAR_START.getTime()+n*7*86400000-1);
const weekStart=n=>new Date(YEAR_START.getTime()+(n-1)*7*86400000);
const weekLabel=n=>{const s=weekStart(n),e=weekEnd(n);const f=d=>`${d.getMonth()+1}/${d.getDate()}`;return `W${String(n).padStart(2,'0')} — ${f(s)}–${f(e)}`;};
const inYTW=(d,wk)=>{if(!d)return false;const t=new Date(d).getTime();return t>=YEAR_START.getTime()&&t<=weekEnd(wk).getTime();};

const _mhCache={};
function moduleHealth(week){
  const wk=week||CURRENT_WEEK;
  if(_mhCache[wk])return _mhCache[wk];
  const res=_moduleHealthImpl(wk);
  _mhCache[wk]=res;
  return res;
}
function _moduleHealthImpl(wk){
  if(!IDX.inc){IDX.inc=_byMod(D.incidents);IDX.prb=_byMod(D.problems);IDX.bug=_byMod(D.bugs);IDX.tc=_byMod(D.testcases);}
  return MODULES.map(m=>{
    const inc=IDX.inc[m].filter(i=>inYTW(i.created_date,wk));
    const openInc=inc.filter(i=>!['RESOLVED','CLOSED'].includes(i.status)||!inYTW(i.resolved_date,wk));
    const critInc=inc.filter(i=>['S1_CRITICAL','S2_HIGH'].includes(i.severity));
    const prb=IDX.prb[m].filter(p=>inYTW(p.created_date,wk));
    const openPrb=prb.filter(p=>!['RESOLVED','CLOSED'].includes(p.status)||!inYTW(p.resolved_date,wk));
    const bugs=IDX.bug[m].filter(b=>inYTW(b.created_date,wk));
    const fixedBugs=bugs.filter(b=>['FIXED','CLOSED'].includes(b.status)&&inYTW(b.fix_verified_date||b.closed_date,wk));
    const tcs=IDX.tc[m].filter(t=>inYTW(t.created_date,wk));
    const execTc=tcs.filter(t=>inYTW(t.execution_date,wk));
    const passedTc=execTc.filter(t=>t.test_result==='PASS');
    const failedTc=execTc.filter(t=>t.test_result==='FAIL');
    const incScore=inc.length===0?100:Math.max(0,100-openInc.length*4-critInc.length*3);
    const bugScore=bugs.length===0?100:Math.round(fixedBugs.length/bugs.length*100);
    const tcScore=(passedTc.length+failedTc.length)===0?100:Math.round(passedTc.length/(passedTc.length+failedTc.length)*100);
    const prbScore=prb.length===0?100:Math.max(0,100-openPrb.length*8);
    const actual=Math.round((incScore*0.3+bugScore*0.3+tcScore*0.3+prbScore*0.1));
    const target=90;
    return {module:m,label:ml(m),incidents:inc.length,openInc:openInc.length,critical:critInc.length,problems:prb.length,openPrb:openPrb.length,bugs:bugs.length,fixedBugs:fixedBugs.length,testcases:tcs.length,passedTc:passedTc.length,failedTc:failedTc.length,incScore,bugScore,tcScore,prbScore,actual,target,gap:actual-target};
  });
}

function WeekSelector({week,setWeek}){
  const weeks=[];for(let i=1;i<=CURRENT_WEEK;i++)weeks.push(i);
  return <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',background:'var(--bg-secondary)',border:'1px solid var(--border)',borderRadius:'var(--radius-md)',marginBottom:'var(--space-lg)',flexWrap:'wrap'}}>
    <button onClick={()=>setWeek(Math.max(1,week-1))} disabled={week<=1} style={{padding:'6px 10px',border:'1px solid var(--border)',background:'var(--bg-card)',borderRadius:6,cursor:'pointer'}}>◀</button>
    <div style={{fontWeight:600,fontSize:13,minWidth:200}}>{weekLabel(week)}</div>
    <button onClick={()=>setWeek(Math.min(CURRENT_WEEK,week+1))} disabled={week>=CURRENT_WEEK} style={{padding:'6px 10px',border:'1px solid var(--border)',background:'var(--bg-card)',borderRadius:6,cursor:'pointer'}}>▶</button>
    <div style={{display:'flex',gap:4,overflowX:'auto',flex:1}}>{weeks.map(n=><button key={n} onClick={()=>setWeek(n)} style={{padding:'5px 12px',borderRadius:999,border:'1px solid var(--border)',background:n===week?'var(--accent-primary)':'transparent',color:n===week?'#fff':'var(--text-secondary)',cursor:'pointer',fontSize:12,fontWeight:500,whiteSpace:'nowrap',flexShrink:0}}>W{String(n).padStart(2,'0')}</button>)}</div>
    <span style={{fontSize:11,color:'var(--text-muted)'}}>Year-to-Week view</span>
  </div>;
}

function ProjectHealthDashboard(){
  const [week,setWeek]=useState(CURRENT_WEEK);
  const mh=useMemo(()=>moduleHealth(week),[week]);
  const overall=Math.round(mh.reduce((s,m)=>s+m.actual,0)/mh.length);
  const target=90;const gap=overall-target;
  const green=mh.filter(m=>m.actual>=80).length;
  const amber=mh.filter(m=>m.actual>=60&&!(m.actual>=80)).length;
  const red=mh.filter(m=>!(m.actual>=60)).length;
  const weakest=[...mh].sort((a,b)=>a.actual-b.actual).slice(0,3).map(m=>m.label).join(', ');
  const strongest=[...mh].sort((a,b)=>b.actual-a.actual).slice(0,3).map(m=>m.label).join(', ');
  const [trend,setTrend]=useState([]);
  const [computing,setComputing]=useState(false);
  useEffect(()=>{
    setComputing(true);
    // Defer heavy computation to next tick so UI can render first
    const t=setTimeout(()=>{
      const YEAR_WEEKS=52,PROJ_AHEAD=4;
      const arr=[];
      const actuals=[];
      for(let w=1;w<=week;w++){const mh2=moduleHealth(w);actuals.push(Math.round(mh2.reduce((s,m)=>s+m.actual,0)/mh2.length));}
      const n=Math.min(4,actuals.length);
      let slope=0;
      if(n>=2){const recent=actuals.slice(-n);slope=(recent[recent.length-1]-recent[0])/(n-1);}
      const lastActual=actuals[actuals.length-1]||0;
      for(let w=1;w<=YEAR_WEEKS;w++){
        const row={week:`W${String(w).padStart(2,'0')}`,target:90};
        if(w<=week)row.actual=actuals[w-1];
        if(w>=week&&w<=Math.min(YEAR_WEEKS,week+PROJ_AHEAD)){
          const offset=w-week;
          row.projection=Math.max(0,Math.min(100,Math.round(lastActual+slope*offset)));
        }
        arr.push(row);
      }
      setTrend(arr);setComputing(false);
    },10);
    return ()=>clearTimeout(t);
  },[week]);
  return <div>
    <h2 className="section-title">Project Health Dashboard — eMPF</h2>
    <WeekSelector week={week} setWeek={setWeek}/>
    <div className="grid grid-4" style={{marginBottom:'var(--space-lg)'}}>
      <div className="card kpi-card"><div className="kpi-value" style={{color:ragColor(overall)}}>{overall}%</div><div className="kpi-label">Actual Health</div><div className="kpi-sub">Target: {target}%</div></div>
      <div className="card kpi-card"><div className="kpi-value" style={{color:gap>=0?'var(--accent-success)':'var(--accent-danger)'}}>{gap>=0?'+':''}{gap}pp</div><div className="kpi-label">Gap vs Target</div></div>
      <div className="card kpi-card"><div className="kpi-value">{green}/{amber}/{red}</div><div className="kpi-label">Modules G / A / R</div></div>
      <div className="card kpi-card"><div className="kpi-value">{MODULES.length}</div><div className="kpi-label">Total Modules</div></div>
    </div>
    <div className="callout" style={{marginTop:0,marginBottom:'var(--space-lg)'}}><h3>💡 Executive Summary — As of {weekLabel(week)}</h3><ul><li><strong>Overall project health {overall}%</strong> — {gap>=0?`meeting target by ${gap}pp`:`below target by ${-gap}pp`}.</li><li><strong>{green}</strong> modules GREEN (≥80), <strong>{amber}</strong> AMBER (60–79), <strong>{red}</strong> RED (below 60).</li><li>Weakest modules: <strong>{weakest}</strong> — prioritise QA remediation.</li><li>Strongest: <strong>{strongest}</strong>.</li></ul></div>
    <div className="card" style={{marginBottom:'var(--space-lg)'}}><h3>Readiness Trend — Actual vs Target (Full Year, As of {weekLabel(week)}) {computing&&<span style={{fontSize:11,color:'var(--accent-warning)',fontWeight:400,marginLeft:8}}>⏳ computing…</span>}</h3><ResponsiveContainer width="100%" height={320}><LineChart data={trend} margin={{top:10,right:30,left:0,bottom:0}}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis dataKey="week" style={{fontSize:10}} interval={3}/><YAxis domain={[0,100]} style={{fontSize:10}} tickFormatter={v=>v+'%'}/><Tooltip formatter={v=>v==null?'—':v+'%'}/><Legend/><Line type="monotone" dataKey="target" stroke={COLORS[2]} strokeWidth={2} strokeDasharray="6 4" dot={false} name="Target 90%"/><Line type="monotone" dataKey="actual" stroke={COLORS[0]} strokeWidth={3} dot={{r:3}} name="Actual" connectNulls={false}/><Line type="monotone" dataKey="projection" stroke={COLORS[1]} strokeWidth={2} strokeDasharray="2 3" dot={false} name="Projection (next 4w)" connectNulls={true}/></LineChart></ResponsiveContainer></div>
    <div className="grid grid-2">
      <div className="card"><h3>Actual vs Target Health by Module</h3><ResponsiveContainer width="100%" height={420}><BarChart data={mh} layout="vertical" margin={{left:20}}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis type="number" domain={[0,100]} style={{fontSize:10}}/><YAxis type="category" dataKey="label" width={170} style={{fontSize:10}}/><Tooltip/><Legend/><Bar dataKey="target" fill="#d0d7de" name="Target"/><Bar dataKey="actual" fill={COLORS[0]} name="Actual"/></BarChart></ResponsiveContainer></div>
      <div className="card"><h3>Module Health Scorecard</h3><div style={{maxHeight:420,overflow:'auto'}}>{[...mh].sort((a,b)=>a.actual-b.actual).map(m=><div key={m.module} className="mod-health-row"><div className="mod-name">{m.label}</div><div><span className={`rag rag-${ragClass(m.actual)}`}></span>{m.actual}</div><div><div className="progress-bar"><div className="progress-fill" style={{width:`${m.actual}%`,background:ragColor(m.actual)}}></div></div></div><div style={{fontSize:11,color:'var(--text-muted)'}}>Tgt {m.target}</div><div style={{fontSize:11,color:m.gap>=0?'var(--accent-success)':'var(--accent-danger)',fontWeight:600}}>{m.gap>=0?'+':''}{m.gap}</div></div>)}</div></div>
    </div>
    <div className="subsection"><h3>Sub-score Breakdown by Module (Incident / Bug Fix / Retest / Problem)</h3><div className="card"><ResponsiveContainer width="100%" height={340}><BarChart data={mh}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis dataKey="label" angle={-40} textAnchor="end" height={130} style={{fontSize:10}}/><YAxis domain={[0,100]} style={{fontSize:10}}/><Tooltip/><Legend/><Bar dataKey="incScore" fill={COLORS[0]} name="Incident"/><Bar dataKey="bugScore" fill={COLORS[2]} name="Bug Fix"/><Bar dataKey="tcScore" fill={COLORS[3]} name="Retest"/><Bar dataKey="prbScore" fill={COLORS[5]} name="Problem"/></BarChart></ResponsiveContainer></div></div>
  </div>;
}

function ModuleQAReport(){
  const [mod,setMod]=useState(MODULES[0]);
  const mh=moduleHealth().find(m=>m.module===mod);
  const inc=D.incidents.filter(i=>i.system_module===mod);
  const bugs=D.bugs.filter(b=>b.system_module===mod);
  const tcs=D.testcases.filter(t=>t.system_module===mod);
  const incTrend={};inc.forEach(i=>{const m=monthOf(i.created_date);if(m){incTrend[m]=incTrend[m]||{month:m,created:0,resolved:0};incTrend[m].created++;}});inc.forEach(i=>{const m=monthOf(i.resolved_date);if(m){incTrend[m]=incTrend[m]||{month:m,created:0,resolved:0};incTrend[m].resolved++;}});
  const trendData=Object.values(incTrend).sort((a,b)=>a.month.localeCompare(b.month)).slice(-12);
  const tcRes={};tcs.forEach(t=>{tcRes[t.test_result||'NOT_RUN']=(tcRes[t.test_result||'NOT_RUN']||0)+1;});
  const tcResData=Object.entries(tcRes).map(([name,value])=>({name,value}));
  const bugStat={};bugs.forEach(b=>{bugStat[b.status||'?']=(bugStat[b.status||'?']||0)+1;});
  const bugStatData=Object.entries(bugStat).map(([name,value])=>({name,value}));
  return <div>
    <h2 className="section-title">Module QA Report</h2>
    <div style={{marginBottom:16}}><strong>Module:</strong> <select value={mod} onChange={e=>setMod(e.target.value)} style={{padding:'6px 12px',marginLeft:8,border:'1px solid var(--border)',borderRadius:6,background:'var(--bg-card)',color:'var(--text-primary)'}}>{MODULES.map(m=><option key={m} value={m}>{ml(m)}</option>)}</select></div>
    {mh&&<>
      <div className="grid grid-4" style={{marginBottom:16}}>
        <div className="card kpi-card"><div className="kpi-value" style={{color:ragColor(mh.actual)}}>{mh.actual}%</div><div className="kpi-label">Health</div><div className="kpi-sub"><span className={`rag rag-${ragClass(mh.actual)}`}></span>Target {mh.target}%</div></div>
        <div className="card kpi-card"><div className="kpi-value">{mh.incidents}</div><div className="kpi-label">Incidents</div><div className="kpi-sub">{mh.openInc} open · {mh.critical} crit</div></div>
        <div className="card kpi-card"><div className="kpi-value">{mh.bugs}</div><div className="kpi-label">Bugs</div><div className="kpi-sub">{mh.fixedBugs} fixed ({mh.bugScore}%)</div></div>
        <div className="card kpi-card"><div className="kpi-value">{mh.testcases}</div><div className="kpi-label">Test Cases</div><div className="kpi-sub">Pass rate {mh.tcScore}%</div></div>
      </div>
      <div className="subsection"><h3>Sub-Score Progress</h3><div className="card">{[['Incident Mgmt',mh.incScore],['Bug Fix Progress',mh.bugScore],['Retest Pass Rate',mh.tcScore],['Problem Control',mh.prbScore]].map(([l,v])=><div key={l} style={{marginBottom:14}}><div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}><span>{l}</span><strong>{v}%</strong></div><div className="progress-bar" style={{height:10}}><div className="progress-fill" style={{width:`${v}%`,background:ragColor(v)}}></div></div></div>)}</div></div>
      <div className="grid grid-2">
        <div className="card"><h3>Incident Trend</h3><ResponsiveContainer width="100%" height={260}><AreaChart data={trendData}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis dataKey="month" style={{fontSize:10}}/><YAxis style={{fontSize:10}}/><Tooltip/><Legend/><Area type="monotone" dataKey="created" stroke={COLORS[4]} fill={COLORS[4]} fillOpacity={.3}/><Area type="monotone" dataKey="resolved" stroke={COLORS[2]} fill={COLORS[2]} fillOpacity={.3}/></AreaChart></ResponsiveContainer></div>
        <div className="card"><h3>Test Case Results</h3><ResponsiveContainer width="100%" height={260}><PieChart><Pie data={tcResData} dataKey="value" nameKey="name" outerRadius={85} label>{tcResData.map((e,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}</Pie><Tooltip/><Legend/></PieChart></ResponsiveContainer></div>
        <div className="card"><h3>Bug Status</h3><ResponsiveContainer width="100%" height={260}><BarChart data={bugStatData}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis dataKey="name" style={{fontSize:10}}/><YAxis style={{fontSize:10}}/><Tooltip/><Bar dataKey="value" fill={COLORS[0]}/></BarChart></ResponsiveContainer></div>
        <div className="card"><h3>QA Scope Summary</h3><table><tbody><tr><td>Functional Tests</td><td>{tcs.filter(t=>t.test_type==='FUNCTIONAL'||t.category==='FUNCTIONAL').length}</td></tr><tr><td>Regression Tests</td><td>{tcs.filter(t=>t.test_type==='REGRESSION').length}</td></tr><tr><td>Verification Tests</td><td>{tcs.filter(t=>t.test_type==='VERIFICATION').length}</td></tr><tr><td>Automated</td><td>{tcs.filter(t=>t.automation_status==='AUTOMATED'||t.automation_status==='SEMI_AUTOMATED').length}</td></tr><tr><td>Manual</td><td>{tcs.filter(t=>t.automation_status==='MANUAL').length}</td></tr></tbody></table></div>
      </div>
    </>}
  </div>;
}

function IPAnalytics(){
  const now=new Date();const ageDays=d=>d?Math.max(0,Math.round((now-new Date(d))/86400000)):0;
  const openInc=D.incidents.filter(i=>!['RESOLVED','CLOSED'].includes(i.status));const openPrb=D.problems.filter(p=>!['RESOLVED','CLOSED'].includes(p.status));
  const buckets=[{l:'0-7d',mx:7},{l:'8-30d',mx:30},{l:'31-90d',mx:90},{l:'91-180d',mx:180},{l:'>180d',mx:99999}];
  const aging=buckets.map(b=>({name:b.l,incidents:0,problems:0}));openInc.forEach(i=>{const a=ageDays(i.created_date);const bi=buckets.findIndex(b=>a<=b.mx);if(bi>=0)aging[bi].incidents++;});openPrb.forEach(p=>{const a=ageDays(p.created_date);const bi=buckets.findIndex(b=>a<=b.mx);if(bi>=0)aging[bi].problems++;});
  const pri=['P1','P2','P3','P4'];const priData=pri.map(p=>({name:p,incidents:D.incidents.filter(i=>i.priority===p).length,problems:D.problems.filter(x=>x.priority===p).length}));
  const sevs={};D.incidents.forEach(i=>{if(i.severity)sevs[i.severity]=(sevs[i.severity]||0)+1;});const sevData=Object.entries(sevs).map(([name,value])=>({name,value}));
  const modData=MODULES.map(m=>({name:ml(m),value:D.incidents.filter(i=>i.system_module===m).length})).sort((a,b)=>b.value-a.value);
  const byMonth={};D.incidents.forEach(i=>{const m=monthOf(i.created_date);if(m){byMonth[m]=byMonth[m]||{month:m,created:0,resolved:0};byMonth[m].created++;}});D.incidents.forEach(i=>{const m=monthOf(i.resolved_date);if(m){byMonth[m]=byMonth[m]||{month:m,created:0,resolved:0};byMonth[m].resolved++;}});const trendData=Object.values(byMonth).sort((a,b)=>a.month.localeCompare(b.month)).slice(-18);
  return <div><h2 className="section-title">Incident & Problem Analytics</h2><div className="grid grid-4" style={{marginBottom:16}}><div className="card kpi-card"><div className="kpi-value">{D.incidents.length}</div><div className="kpi-label">Total Incidents</div></div><div className="card kpi-card"><div className="kpi-value">{openInc.length}</div><div className="kpi-label">Open</div></div><div className="card kpi-card"><div className="kpi-value">{D.problems.length}</div><div className="kpi-label">Problems</div></div><div className="card kpi-card"><div className="kpi-value">{openPrb.length}</div><div className="kpi-label">Open Problems</div></div></div><div className="grid grid-2"><div className="card"><h3>Aging (Open)</h3><ResponsiveContainer width="100%" height={260}><BarChart data={aging}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis dataKey="name" style={{fontSize:10}}/><YAxis style={{fontSize:10}}/><Tooltip/><Legend/><Bar dataKey="incidents" fill={COLORS[0]}/><Bar dataKey="problems" fill={COLORS[3]}/></BarChart></ResponsiveContainer></div><div className="card"><h3>Priority</h3><ResponsiveContainer width="100%" height={260}><BarChart data={priData}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis dataKey="name"/><YAxis/><Tooltip/><Legend/><Bar dataKey="incidents" fill={COLORS[1]}/><Bar dataKey="problems" fill={COLORS[2]}/></BarChart></ResponsiveContainer></div><div className="card"><h3>Severity</h3><ResponsiveContainer width="100%" height={260}><PieChart><Pie data={sevData} dataKey="value" nameKey="name" outerRadius={85} label>{sevData.map((e,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}</Pie><Tooltip/><Legend/></PieChart></ResponsiveContainer></div><div className="card"><h3>Incidents by Module</h3><ResponsiveContainer width="100%" height={300}><BarChart data={modData} layout="vertical" margin={{left:20}}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis type="number" style={{fontSize:10}}/><YAxis type="category" dataKey="name" width={170} style={{fontSize:10}}/><Tooltip/><Bar dataKey="value" fill={COLORS[0]}/></BarChart></ResponsiveContainer></div></div><div className="card" style={{marginTop:16}}><h3>Monthly: Created vs Resolved</h3><ResponsiveContainer width="100%" height={280}><AreaChart data={trendData}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis dataKey="month" style={{fontSize:10}}/><YAxis style={{fontSize:10}}/><Tooltip/><Legend/><Area type="monotone" dataKey="created" stroke={COLORS[4]} fill={COLORS[4]} fillOpacity={.3}/><Area type="monotone" dataKey="resolved" stroke={COLORS[2]} fill={COLORS[2]} fillOpacity={.3}/></AreaChart></ResponsiveContainer></div></div>;
}

const BUG_FLOW=['OPEN','IN_PROGRESS','FIXED','CLOSED','REOPENED'];const TC_FLOW=['NOT_RUN','PENDING','PASS','FAIL','BLOCKED'];
function sprints(items,key){const set=new Set();items.forEach(i=>{const m=monthOf(i[key]);if(m)set.add(m);});return [...set].sort().reverse();}
function Kanban({items,flow,titleKey,idKey,dateKey,statusKey,onClick}){const sp=sprints(items,dateKey);const [sprint,setSprint]=useState(sp[0]||'');useEffect(()=>{if(!sprint&&sp.length)setSprint(sp[0]);},[sp.length]);const inSprint=items.filter(i=>monthOf(i[dateKey])===sprint);return <div><div className="sprint-sel"><strong>Sprint:</strong>{sp.slice(0,10).map(s=><button key={s} className={s===sprint?'active':''} onClick={()=>setSprint(s)}>{s}</button>)}<span style={{marginLeft:12,color:'var(--text-secondary)',fontSize:12}}>{inSprint.length} items</span></div><div className="kanban">{flow.map(st=>{const col=inSprint.filter(i=>(i[statusKey]||'').toUpperCase()===st);return <div key={st} className="kcol"><h4>{st}<span className="cnt">{col.length}</span></h4>{col.slice(0,50).map(it=><div key={it[idKey]} className="kitem" onClick={()=>onClick(it)}><div className="kid">{it[idKey]}</div><div className="ktit">{(it[titleKey]||'').slice(0,60)}</div><div style={{fontSize:10,color:'var(--text-secondary)',display:'flex',gap:6,flexWrap:'wrap'}}><Badge v={it.priority} cls={priClass(it.priority)}/><Badge v={it.severity} cls={sevClass(it.severity)}/><span>{ml(it.system_module)}</span></div></div>)}</div>;})}</div></div>;}
function BugKanban(){const [sel,setSel]=useState(null);return <div><h2 className="section-title">Bug Kanban — 1 Month = 1 Sprint</h2>{sel&&<div><div style={{display:'flex',justifyContent:'flex-end',marginBottom:8}}><button onClick={()=>setSel(null)}>✕ Close</button></div><ProcessFlow anchor={sel} anchorType="bug"/></div>}<Kanban items={D.bugs} flow={BUG_FLOW} titleKey="title" idKey="bug_id" dateKey="created_date" statusKey="status" onClick={setSel}/></div>;}
function TCKanban(){const [sel,setSel]=useState(null);return <div><h2 className="section-title">Test Case Kanban</h2>{sel&&<div><div style={{display:'flex',justifyContent:'flex-end',marginBottom:8}}><button onClick={()=>setSel(null)}>✕ Close</button></div><ProcessFlow anchor={sel} anchorType="testcase"/></div>}<Kanban items={D.testcases} flow={TC_FLOW} titleKey="title" idKey="testcase_id" dateKey="created_date" statusKey="test_result" onClick={setSel}/></div>;}

function BugRetestDashboard(){
  const bugStat={};D.bugs.forEach(b=>{bugStat[b.status||'?']=(bugStat[b.status||'?']||0)+1;});const bugStatData=Object.entries(bugStat).map(([name,value])=>({name,value}));
  const bySprint={};D.bugs.forEach(b=>{const m=monthOf(b.created_date);if(m){bySprint[m]=bySprint[m]||{sprint:m,created:0,closed:0};bySprint[m].created++;}});D.bugs.forEach(b=>{const m=monthOf(b.closed_date);if(m){bySprint[m]=bySprint[m]||{sprint:m,created:0,closed:0};bySprint[m].closed++;}});const sprintData=Object.values(bySprint).sort((a,b)=>a.sprint.localeCompare(b.sprint)).slice(-12);
  const pr={};D.testcases.forEach(t=>{const m=monthOf(t.execution_date);if(!m)return;pr[m]=pr[m]||{month:m,pass:0,fail:0,total:0};pr[m].total++;if(t.test_result==='PASS')pr[m].pass++;if(t.test_result==='FAIL')pr[m].fail++;});const prData=Object.values(pr).map(r=>({month:r.month,passRate:r.total?Math.round(r.pass/r.total*100):0,fail:r.fail})).sort((a,b)=>a.month.localeCompare(b.month)).slice(-12);
  const passed=D.testcases.filter(t=>t.test_result==='PASS').length;const failed=D.testcases.filter(t=>t.test_result==='FAIL').length;const fixed=D.bugs.filter(b=>['FIXED','CLOSED'].includes(b.status)).length;
  return <div><h2 className="section-title">Bug Fix & Retest Dashboard</h2><div className="grid grid-4" style={{marginBottom:16}}><div className="card kpi-card"><div className="kpi-value">{D.bugs.length}</div><div className="kpi-label">Total Bugs</div></div><div className="card kpi-card"><div className="kpi-value">{fixed}</div><div className="kpi-label">Fixed/Closed</div><div className="kpi-sub">{Math.round(fixed/Math.max(1,D.bugs.length)*100)}% fix rate</div></div><div className="card kpi-card"><div className="kpi-value">{D.testcases.length}</div><div className="kpi-label">Test Cases</div></div><div className="card kpi-card"><div className="kpi-value">{Math.round(passed/Math.max(1,passed+failed)*100)}%</div><div className="kpi-label">Retest Pass Rate</div></div></div><div className="grid grid-2"><div className="card"><h3>Bug Status</h3><ResponsiveContainer width="100%" height={260}><PieChart><Pie data={bugStatData} dataKey="value" nameKey="name" outerRadius={85} label>{bugStatData.map((e,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}</Pie><Tooltip/><Legend/></PieChart></ResponsiveContainer></div><div className="card"><h3>Sprint Burndown</h3><ResponsiveContainer width="100%" height={260}><BarChart data={sprintData}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis dataKey="sprint" style={{fontSize:10}}/><YAxis style={{fontSize:10}}/><Tooltip/><Legend/><Bar dataKey="created" fill={COLORS[4]}/><Bar dataKey="closed" fill={COLORS[2]}/></BarChart></ResponsiveContainer></div></div><div className="card" style={{marginTop:16}}><h3>Retest Pass Rate Trend</h3><ResponsiveContainer width="100%" height={280}><LineChart data={prData}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis dataKey="month" style={{fontSize:10}}/><YAxis domain={[0,100]} style={{fontSize:10}}/><Tooltip/><Legend/><Line type="monotone" dataKey="passRate" stroke={COLORS[2]} strokeWidth={3}/><Line type="monotone" dataKey="fail" stroke={COLORS[4]} strokeWidth={2}/></LineChart></ResponsiveContainer></div></div>;
}

/* ===========================================================================
   BUSINESS DASHBOARD — eMPF Executive View
   Lifecycle: Onboarding → Enrolment → Contribution → Payment → Investment
              → Account Mgmt → Claims → Compliance → Termination
   =========================================================================== */
const BIZ=window.__BIZ_DATA__||{employers:[],members:[],schemes:[],funds:[],contributions:[],fund_transactions:[],account_transfers:[],claims:[],compliance_cases:[],daily_aum_snapshots:[]};
const fmtHKD=v=>!v||isNaN(v)?'HK$0':v>=1e9?`HK$${(v/1e9).toFixed(2)}B`:v>=1e6?`HK$${(v/1e6).toFixed(1)}M`:v>=1e3?`HK$${(v/1e3).toFixed(1)}K`:`HK$${Math.round(v).toLocaleString()}`;
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const pct=(a,b)=>!b?0:Math.round(a/b*1000)/10;
const ymOf=d=>!d?null:String(d).slice(0,7);

function BizExecDashboard(){
  const k=useMemo(()=>{
    // ===== Top KPIs =====
    const totalAUM=BIZ.funds.reduce((s,f)=>s+num(f.aum_hkm)*1e6,0);
    const totalMembers=BIZ.members.length;
    const activeMembers=BIZ.members.filter(m=>m.status==='ACTIVE').length;
    const totalEmployers=BIZ.employers.length;
    const activeEmployers=BIZ.employers.filter(e=>e.status==='ACTIVE').length;
    // Contributions YTD
    const totMandatory=BIZ.contributions.reduce((s,c)=>s+num(c.employer_mandatory_amount)+num(c.employee_mandatory_amount),0);
    const totVoluntary=BIZ.contributions.reduce((s,c)=>s+num(c.employer_voluntary_amount)+num(c.employee_voluntary_amount),0);
    const totTVC=BIZ.contributions.reduce((s,c)=>s+num(c.tvc_amount),0);
    // On-time payment
    const onTime=BIZ.contributions.filter(c=>c.is_on_time==='true'||c.is_on_time===true||c.status==='ON_TIME').length;
    const ontimeRate=pct(onTime,BIZ.contributions.length);
    // Outstanding
    const outstanding=BIZ.contributions.filter(c=>['DEFAULT_LATE','DEFAULT_UNPAID','DEFAULT_UNDERPAID','REJECTED'].includes(c.status)).reduce((s,c)=>s+num(c.total_contribution),0);
    // DIS adoption
    const disMembers=BIZ.members.filter(m=>m.uses_dis==='true'||m.uses_dis===true).length;
    const disPct=pct(disMembers,BIZ.members.length);
    // Claims
    const paidClaims=BIZ.claims.filter(c=>c.status==='PAID');
    const totalPayouts=paidClaims.reduce((s,c)=>s+num(c.amount_paid),0);
    const slaMet=BIZ.claims.filter(c=>c.sla_met==='true'||c.sla_met===true).length;
    const slaRate=pct(slaMet,BIZ.claims.length);
    // Compliance
    const openCompliance=BIZ.compliance_cases.filter(c=>c.status==='OPEN'||c.status==='ESCALATED').length;
    const totalSurcharge=BIZ.compliance_cases.reduce((s,c)=>s+num(c.surcharge_amount),0);
    return {totalAUM,totalMembers,activeMembers,totalEmployers,activeEmployers,totMandatory,totVoluntary,totTVC,ontimeRate,outstanding,disMembers,disPct,paidClaims:paidClaims.length,totalPayouts,slaRate,openCompliance,totalSurcharge};
  },[]);

  // ===== Contribution trend by month =====
  const contribTrend=useMemo(()=>{
    const m={};
    BIZ.contributions.forEach(c=>{
      const k=c.contribution_period;if(!k)return;
      m[k]=m[k]||{month:k,mandatory:0,voluntary:0,tvc:0,total:0,count:0,onTime:0};
      m[k].mandatory+=num(c.employer_mandatory_amount)+num(c.employee_mandatory_amount);
      m[k].voluntary+=num(c.employer_voluntary_amount)+num(c.employee_voluntary_amount);
      m[k].tvc+=num(c.tvc_amount);
      m[k].total+=num(c.total_contribution);
      m[k].count++;
      if(c.is_on_time==='true'||c.is_on_time===true||c.status==='ON_TIME')m[k].onTime++;
    });
    return Object.values(m).sort((a,b)=>a.month.localeCompare(b.month)).map(r=>({...r,mandatory:Math.round(r.mandatory),voluntary:Math.round(r.voluntary),tvc:Math.round(r.tvc),total:Math.round(r.total),onTimePct:pct(r.onTime,r.count)}));
  },[]);

  // ===== AUM growth =====
  const aumTrend=useMemo(()=>{
    const m={};
    BIZ.daily_aum_snapshots.forEach(s=>{
      const k=String(s.snapshot_date).slice(0,7);if(!k)return;
      m[k]=m[k]||{month:k,aum:0,n:0,inflow:0};
      m[k].aum+=num(s.total_aum_hkd);m[k].n++;m[k].inflow+=num(s.net_inflow_hkd);
    });
    return Object.values(m).sort((a,b)=>a.month.localeCompare(b.month)).map(r=>({month:r.month,aum:Math.round(r.aum/r.n),inflow:Math.round(r.inflow)}));
  },[]);

  // ===== Compliance heatmap by industry =====
  const industryComp=useMemo(()=>{
    const m={};
    BIZ.employers.forEach(e=>{
      const i=e.industry||'OTHER';
      m[i]=m[i]||{industry:i,green:0,amber:0,red:0,total:0};
      m[i].total++;
      if(e.compliance_rating==='GREEN')m[i].green++;
      else if(e.compliance_rating==='AMBER')m[i].amber++;
      else if(e.compliance_rating==='RED')m[i].red++;
    });
    return Object.values(m).sort((a,b)=>b.total-a.total);
  },[]);

  // ===== Claim mix =====
  const claimMix=useMemo(()=>{
    const m={};
    BIZ.claims.forEach(c=>{m[c.claim_type]=(m[c.claim_type]||0)+1;});
    return Object.entries(m).map(([name,value])=>({name:name.replace(/_/g,' '),value})).sort((a,b)=>b.value-a.value);
  },[]);

  // ===== Fund category mix =====
  const fundMix=useMemo(()=>{
    const m={};
    BIZ.funds.forEach(f=>{const k=f.fund_type||'OTHER';m[k]=(m[k]||0)+num(f.aum_hkm);});
    return Object.entries(m).map(([name,value])=>({name:name.replace(/_/g,' '),value:Math.round(value)})).sort((a,b)=>b.value-a.value);
  },[]);

  // ===== Lifecycle health (9 stages) =====
  const lifecycle=useMemo(()=>{
    const stages=[
      {key:'ONBOARDING',label:'Onboarding',
        score:Math.round(pct(BIZ.employers.filter(e=>e.api_integrated==='true'||e.api_integrated===true).length,BIZ.employers.length)+30),
        target:80,
        detail:`${BIZ.employers.filter(e=>e.api_integrated==='true'||e.api_integrated===true).length} of ${BIZ.employers.length} employers API-integrated`,
        metric:'API Integration Rate'},
      {key:'ENROLMENT',label:'Enrolment',
        score:Math.round(pct(BIZ.members.filter(m=>m.enrollment_compliant==='true'||m.enrollment_compliant===true).length,BIZ.members.length)),
        target:95,
        detail:`${BIZ.members.filter(m=>m.enrollment_compliant==='true'||m.enrollment_compliant===true).length} of ${BIZ.members.length} members enrolled within the 60-day rule`,
        metric:'On-time Enrolment %'},
      {key:'CONTRIBUTION',label:'Contribution',
        score:Math.min(100,Math.round(k.ontimeRate)),
        target:97,
        detail:`${k.ontimeRate}% of contributions submitted on time; outstanding ${fmtHKD(k.outstanding)}`,
        metric:'On-time Submission Rate'},
      {key:'PAYMENT',label:'Payment',
        score:Math.min(100,Math.round(k.ontimeRate)),
        target:97,
        detail:`${k.ontimeRate}% payments settled by contribution day; ${fmtHKD(k.outstanding)} in default`,
        metric:'On-time Payment Rate'},
      {key:'INVESTMENT',label:'Investment',
        score:Math.round(BIZ.funds.reduce((s,f)=>s+num(f.ytd_return_pct),0)/Math.max(1,BIZ.funds.length)*8+50),
        target:80,
        detail:`Avg YTD return ${(BIZ.funds.reduce((s,f)=>s+num(f.ytd_return_pct),0)/Math.max(1,BIZ.funds.length)).toFixed(1)}% across ${BIZ.funds.length} funds; ${k.disPct}% DIS adoption`,
        metric:'Weighted Fund Performance'},
      {key:'ACCOUNT_MGMT',label:'Account Mgmt',
        score:Math.round(pct(BIZ.account_transfers.filter(t=>t.status==='COMPLETED').length,BIZ.account_transfers.length)),
        target:90,
        detail:`${BIZ.account_transfers.filter(t=>t.status==='COMPLETED').length} of ${BIZ.account_transfers.length} ECA / consolidation transfers completed`,
        metric:'Transfer Completion Rate'},
      {key:'CLAIMS',label:'Claims',
        score:Math.round(k.slaRate),
        target:90,
        detail:`${k.slaRate}% of claims met 30-day SLA; ${k.paidClaims} paid totalling ${fmtHKD(k.totalPayouts)}`,
        metric:'30-day SLA Adherence'},
      {key:'COMPLIANCE',label:'Compliance',
        score:Math.round(Math.max(0,100-k.openCompliance/Math.max(1,BIZ.compliance_cases.length)*100)),
        target:85,
        detail:`${k.openCompliance} open of ${BIZ.compliance_cases.length} total cases; surcharges ${fmtHKD(k.totalSurcharge)}`,
        metric:'Closed-case Rate'},
      {key:'TERMINATION',label:'Termination',
        score:85,
        target:85,
        detail:`Offboarding flows for terminated employees — auto-transfer after 3-month inaction rule`,
        metric:'Offboarding Compliance'},
    ];
    return stages.map(s=>({...s,score:Math.max(0,Math.min(100,s.score)),rag:s.score>=80?'green':s.score>=60?'amber':'red',gap:s.score-s.target}));
  },[k]);

  const overallScore=Math.round(lifecycle.reduce((s,x)=>s+x.score,0)/lifecycle.length);

  const COLOR={green:'var(--accent-success)',amber:'var(--accent-warning)',red:'var(--accent-danger)'};

  return <div>
    <h2 className="section-title">Business Executive Overview</h2>

    {/* Top KPI strip */}
    <div className="grid grid-4" style={{marginBottom:'var(--space-lg)'}}>
      <div className="biz-kpi green"><div className="v">{fmtHKD(k.totalAUM)}</div><div className="l">Total AUM</div><div className="s">across {BIZ.funds.length} funds · {BIZ.schemes.length} schemes</div></div>
      <div className="biz-kpi"><div className="v">{k.activeMembers.toLocaleString()}</div><div className="l">Active Members</div><div className="s">of {k.totalMembers.toLocaleString()} total</div></div>
      <div className="biz-kpi"><div className="v">{k.activeEmployers.toLocaleString()}</div><div className="l">Active Employers</div><div className="s">on eMPF Platform</div></div>
      <div className="biz-kpi green"><div className="v">{fmtHKD(k.totMandatory)}</div><div className="l">Mandatory Contrib (period)</div><div className="s">+{fmtHKD(k.totVoluntary+k.totTVC)} voluntary/TVC</div></div>
    </div>
    <div className="grid grid-4" style={{marginBottom:'var(--space-lg)'}}>
      <div className={`biz-kpi ${k.ontimeRate>=95?'green':k.ontimeRate>=85?'amber':'red'}`}><div className="v">{k.ontimeRate}%</div><div className="l">On-time Payment Rate</div><div className="s">target ≥97%</div></div>
      <div className={`biz-kpi ${k.outstanding>5e7?'red':k.outstanding>1e7?'amber':'green'}`}><div className="v">{fmtHKD(k.outstanding)}</div><div className="l">Outstanding Contributions</div><div className="s">in default / late</div></div>
      <div className={`biz-kpi ${k.slaRate>=90?'green':'amber'}`}><div className="v">{k.slaRate}%</div><div className="l">Claims SLA (≤30d)</div><div className="s">{k.paidClaims} paid · {fmtHKD(k.totalPayouts)} disbursed</div></div>
      <div className={`biz-kpi ${k.openCompliance<50?'green':k.openCompliance<150?'amber':'red'}`}><div className="v">{k.openCompliance}</div><div className="l">Open Compliance Cases</div><div className="s">surcharge {fmtHKD(k.totalSurcharge)}</div></div>
    </div>

    {/* Executive Summary (moved above lifecycle) */}
    <div className="callout" style={{marginTop:0,marginBottom:'var(--space-lg)'}}>
      <h3>💡 Executive Summary</h3>
      <ul>
        <li><strong>Total AUM at {fmtHKD(k.totalAUM)}</strong> across {BIZ.schemes.length} onboarded schemes covering {k.activeMembers.toLocaleString()} active members in {k.activeEmployers.toLocaleString()} employers.</li>
        <li>Contribution operations: <strong>{k.ontimeRate}% on-time payment rate</strong> {k.ontimeRate>=95?'✓ above industry benchmark':'⚠ below 95% benchmark'} — outstanding contributions in default total {fmtHKD(k.outstanding)}.</li>
        <li>Claims: <strong>{k.paidClaims} payouts</strong> totaling {fmtHKD(k.totalPayouts)}, with <strong>{k.slaRate}% meeting the 30-day SLA</strong>. Top reason: {claimMix[0]?.name||'—'} ({pct(claimMix[0]?.value||0,BIZ.claims.length)}%).</li>
        <li>Compliance: <strong>{k.openCompliance} open cases</strong>, surcharges totalling {fmtHKD(k.totalSurcharge)}. Risk-rated employers — Green: {industryComp.reduce((s,r)=>s+r.green,0)} · Amber: {industryComp.reduce((s,r)=>s+r.amber,0)} · Red: {industryComp.reduce((s,r)=>s+r.red,0)}.</li>
        <li>Investment: <strong>{k.disPct}% DIS adoption</strong> ({k.disMembers.toLocaleString()} members), aligning with MPFA published benchmark of ~30%.</li>
        <li>Lifecycle health overall: <strong>{overallScore}%</strong>. Weakest stage: <strong>{[...lifecycle].sort((a,b)=>a.score-b.score)[0]?.label}</strong>. Strongest: <strong>{[...lifecycle].sort((a,b)=>b.score-a.score)[0]?.label}</strong>.</li>
      </ul>
    </div>

    {/* Lifecycle health — MBB-style chevron flow */}
    <div className="card" style={{marginBottom:'var(--space-lg)',overflow:'visible'}}>
      <h3 style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>eMPF Business Lifecycle — Health Flow</span>
        <span style={{fontSize:10,color:'var(--text-muted)',fontWeight:500,letterSpacing:1,textTransform:'uppercase'}}>Hover any stage for detail</span>
      </h3>
      <div className="lc-banner">
        <div>
          <div><span className="num">{overallScore}</span><span className="unit">%</span></div>
          <div className="sub">Overall Health Score</div>
        </div>
        <div className="desc">Nine stages of the eMPF member & scheme lifecycle, each scored against its own operational target. Upstream weakness typically propagates downstream — read left to right to diagnose root-cause patterns.</div>
        <div className="pill-row">
          <span className="pill"><span className="d" style={{background:'#6ee4a0'}}></span>{lifecycle.filter(s=>s.rag==='green').length} Healthy</span>
          <span className="pill"><span className="d" style={{background:'#ffc368'}}></span>{lifecycle.filter(s=>s.rag==='amber').length} Watch</span>
          <span className="pill"><span className="d" style={{background:'#ff7a70'}}></span>{lifecycle.filter(s=>s.rag==='red').length} Critical</span>
        </div>
      </div>
      <div className="lc-flow">
        {lifecycle.map((s,i)=>{
          const ICONS={ONBOARDING:'🚀',ENROLMENT:'📝',CONTRIBUTION:'💰',PAYMENT:'💳',INVESTMENT:'📈',ACCOUNT_MGMT:'🔀',CLAIMS:'📋',COMPLIANCE:'⚖️',TERMINATION:'🏁'};
          const statusLabel={green:'On Target',amber:'Below Target',red:'Critical Gap'}[s.rag];
          return <div key={s.key} className={`lc-chev ${s.rag}`}>
            <div className="ic">{ICONS[s.key]||'●'}</div>
            <div className="lbl">{s.label}</div>
            <div className="sc">{s.score}<span style={{fontSize:10,opacity:.75,marginLeft:1}}>%</span></div>
            <div className="lc-progress"><div className="f" style={{width:`${s.score}%`}}></div></div>
            <div className="lc-tooltip">
              <div className="lc-tt-head">
                <span className={`tag ${s.rag}`} style={{background:s.rag==='green'?'#2c7a4d':s.rag==='amber'?'#b8761d':'#b5352f'}}></span>
                <span className="name">{s.label}</span>
                <span className={`status ${s.rag}`}>{statusLabel}</span>
              </div>
              <div className="lc-tt-metric">{s.metric}</div>
              <div className="lc-tt-nums">
                <div className="blk"><div className="v">{s.score}%</div><div className="l">Actual</div></div>
                <div className="blk"><div className="v tgt">{s.target}%</div><div className="l">Target</div></div>
                <div className="blk"><div style={{marginTop:4}}><span className={`lc-tt-gap ${s.gap>=0?'pos':'neg'}`}>{s.gap>=0?'+':''}{s.gap} pp</span></div><div className="l" style={{marginTop:6}}>Gap</div></div>
              </div>
              <div className="lc-tt-detail">{s.detail}</div>
            </div>
          </div>;
        })}
      </div>
      <div className="lc-legend">
        <span><span className="sw" style={{background:'#2c7a4d'}}></span>Healthy (≥80%)</span>
        <span><span className="sw" style={{background:'#b8761d'}}></span>Watch (60–79%)</span>
        <span><span className="sw" style={{background:'#b5352f'}}></span>Critical (&lt;60%)</span>
        <span className="note">Colour thresholds calibrated to stage-specific operational targets</span>
      </div>
    </div>

    {/* Contribution trend + composition */}
    <div className="grid grid-2" style={{marginBottom:'var(--space-lg)'}}>
      <div className="card"><h3>💰 Monthly Contribution Inflow (HK$)</h3>
        <ResponsiveContainer width="100%" height={280}><BarChart data={contribTrend}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis dataKey="month" style={{fontSize:9}} angle={-30} textAnchor="end" height={60}/><YAxis style={{fontSize:10}} tickFormatter={fmtHKD}/><Tooltip formatter={fmtHKD}/><Legend/><Bar dataKey="mandatory" stackId="a" fill={COLORS[0]} name="Mandatory"/><Bar dataKey="voluntary" stackId="a" fill={COLORS[2]} name="Voluntary"/><Bar dataKey="tvc" stackId="a" fill={COLORS[3]} name="TVC"/></BarChart></ResponsiveContainer>
      </div>
      <div className="card"><h3>📈 On-Time Payment Rate Trend (%)</h3>
        <ResponsiveContainer width="100%" height={280}><LineChart data={contribTrend}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis dataKey="month" style={{fontSize:9}} angle={-30} textAnchor="end" height={60}/><YAxis domain={[80,100]} style={{fontSize:10}} tickFormatter={v=>v+'%'}/><Tooltip formatter={v=>v+'%'}/><Legend/><Line type="monotone" dataKey="onTimePct" stroke={COLORS[2]} strokeWidth={3} name="Actual"/><ReferenceLine y={97} stroke={COLORS[3]} strokeDasharray="5 4" label={{value:'Target 97%',position:'right',fontSize:10,fill:'var(--text-secondary)'}}/></LineChart></ResponsiveContainer>
      </div>
    </div>

    {/* AUM growth */}
    <div className="card" style={{marginBottom:'var(--space-lg)'}}>
      <h3>🏦 Assets Under Management — Growth Trend</h3>
      <ResponsiveContainer width="100%" height={280}><AreaChart data={aumTrend}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis dataKey="month" style={{fontSize:9}} angle={-30} textAnchor="end" height={60}/><YAxis style={{fontSize:10}} tickFormatter={fmtHKD}/><Tooltip formatter={fmtHKD}/><Legend/><Area type="monotone" dataKey="aum" stroke={COLORS[0]} fill={COLORS[0]} fillOpacity={.25} name="Average AUM"/></AreaChart></ResponsiveContainer>
    </div>

    {/* Two side-by-side: Industry compliance + Claim mix */}
    <div className="grid grid-2" style={{marginBottom:'var(--space-lg)'}}>
      <div className="card"><h3>🏢 Compliance Health by Industry</h3>
        <div style={{maxHeight:340,overflow:'auto',marginTop:8}}>
          {industryComp.map(r=>{const g=r.green/r.total*100,a=r.amber/r.total*100,d=r.red/r.total*100;return <div key={r.industry} className="heatmap-row">
            <div style={{fontWeight:600,fontSize:11}}>{r.industry.replace(/_/g,' ')}</div>
            <div style={{display:'flex',height:18,borderRadius:3,overflow:'hidden'}}>
              <div className="heatmap-cell" style={{width:`${g}%`,background:'var(--accent-success)'}} title={`Green: ${r.green}`}></div>
              <div className="heatmap-cell" style={{width:`${a}%`,background:'var(--accent-warning)'}} title={`Amber: ${r.amber}`}></div>
              <div className="heatmap-cell" style={{width:`${d}%`,background:'var(--accent-danger)'}} title={`Red: ${r.red}`}></div>
            </div>
            <div style={{textAlign:'right',color:'var(--text-secondary)'}}>{r.total}</div>
          </div>;})}
        </div>
      </div>
      <div className="card"><h3>📋 Claim Reasons Distribution</h3>
        <ResponsiveContainer width="100%" height={300}><PieChart><Pie data={claimMix} dataKey="value" nameKey="name" outerRadius={100} label={({name,percent})=>`${name} ${(percent*100).toFixed(0)}%`} labelLine={false}>{claimMix.map((e,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}</Pie><Tooltip/></PieChart></ResponsiveContainer>
      </div>
    </div>

    {/* Fund category mix */}
    <div className="card" style={{marginBottom:'var(--space-lg)'}}>
      <h3>💼 AUM Distribution by Fund Category</h3>
      <ResponsiveContainer width="100%" height={300}><BarChart data={fundMix} layout="vertical" margin={{left:30}}><CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/><XAxis type="number" style={{fontSize:10}} tickFormatter={v=>fmtHKD(v*1e6)}/><YAxis type="category" dataKey="name" width={170} style={{fontSize:10}}/><Tooltip formatter={v=>fmtHKD(v*1e6)}/><Bar dataKey="value" fill={COLORS[1]}/></BarChart></ResponsiveContainer>
    </div>

    {/* Exec Summary moved to top (above lifecycle) */}
  </div>;
}

/* === Sub-pages: lightweight category drilldowns === */
function BizContributionPage(){
  const monthly=useMemo(()=>{const m={};BIZ.contributions.forEach(c=>{const k=c.contribution_period;if(!k)return;m[k]=m[k]||{month:k,onTime:0,late:0,default:0,rejected:0,count:0,total:0,surcharge:0};m[k].count++;m[k].total+=num(c.total_contribution);m[k].surcharge+=num(c.surcharge_amount);if(c.status==='ON_TIME')m[k].onTime++;else if(c.status==='LATE')m[k].late++;else if(c.status==='REJECTED')m[k].rejected++;else m[k].default++;});return Object.values(m).sort((a,b)=>a.month.localeCompare(b.month));},[]);
  const byMethod={};BIZ.contributions.forEach(c=>{byMethod[c.payment_method||'?']=(byMethod[c.payment_method||'?']||0)+1;});
  const methodData=Object.entries(byMethod).map(([name,value])=>({name,value}));
  const ageBuckets={'0d':0,'1-7d':0,'8-30d':0,'>30d':0};
  BIZ.contributions.forEach(c=>{const d=parseInt(c.days_late)||0;if(d<=0)ageBuckets['0d']++;else if(d<=7)ageBuckets['1-7d']++;else if(d<=30)ageBuckets['8-30d']++;else ageBuckets['>30d']++;});
  const ageData=Object.entries(ageBuckets).map(([name,value])=>({name,value}));
  return <div>
    <h2 className="section-title">Contribution & Payment</h2>
    <div className="grid grid-2"><div className="card"><h3>Contribution Status by Month</h3><ResponsiveContainer width="100%" height={280}><BarChart data={monthly}><CartesianGrid strokeDasharray="3 3"/><XAxis dataKey="month" angle={-30} textAnchor="end" height={60} style={{fontSize:9}}/><YAxis style={{fontSize:10}}/><Tooltip/><Legend/><Bar dataKey="onTime" stackId="s" fill={COLORS[2]} name="On-time"/><Bar dataKey="late" stackId="s" fill={COLORS[3]} name="Late"/><Bar dataKey="default" stackId="s" fill={COLORS[4]} name="Default"/></BarChart></ResponsiveContainer></div>
    <div className="card"><h3>Surcharge Collected by Month</h3><ResponsiveContainer width="100%" height={280}><AreaChart data={monthly}><CartesianGrid strokeDasharray="3 3"/><XAxis dataKey="month" angle={-30} textAnchor="end" height={60} style={{fontSize:9}}/><YAxis style={{fontSize:10}} tickFormatter={fmtHKD}/><Tooltip formatter={fmtHKD}/><Area type="monotone" dataKey="surcharge" stroke={COLORS[4]} fill={COLORS[4]} fillOpacity={.3}/></AreaChart></ResponsiveContainer></div></div>
    <div className="grid grid-2" style={{marginTop:16}}><div className="card"><h3>Payment Method Mix</h3><ResponsiveContainer width="100%" height={260}><PieChart><Pie data={methodData} dataKey="value" nameKey="name" outerRadius={85} label>{methodData.map((e,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}</Pie><Tooltip/><Legend/></PieChart></ResponsiveContainer></div>
    <div className="card"><h3>Late Payment Aging</h3><ResponsiveContainer width="100%" height={260}><BarChart data={ageData}><CartesianGrid strokeDasharray="3 3"/><XAxis dataKey="name"/><YAxis style={{fontSize:10}}/><Tooltip/><Bar dataKey="value" fill={COLORS[3]}/></BarChart></ResponsiveContainer></div></div>
  </div>;
}

function BizMemberPage(){
  const ageDist={};BIZ.members.forEach(m=>{ageDist[m.age_bracket||'?']=(ageDist[m.age_bracket||'?']||0)+1;});
  const ageData=Object.entries(ageDist).map(([name,value])=>({name,value})).sort((a,b)=>a.name.localeCompare(b.name));
  const incomeDist={};BIZ.members.forEach(m=>{incomeDist[m.relevant_income_bracket||'?']=(incomeDist[m.relevant_income_bracket||'?']||0)+1;});
  const incomeData=Object.entries(incomeDist).map(([name,value])=>({name,value}));
  const acctType={};BIZ.members.forEach(m=>{acctType[m.account_type||'?']=(acctType[m.account_type||'?']||0)+1;});
  const acctData=Object.entries(acctType).map(([name,value])=>({name,value}));
  const enrollMonths={};BIZ.members.forEach(m=>{const k=ymOf(m.enrollment_date);if(!k)return;enrollMonths[k]=enrollMonths[k]||{month:k,total:0,compliant:0};enrollMonths[k].total++;if(m.enrollment_compliant==='true'||m.enrollment_compliant===true)enrollMonths[k].compliant++;});
  const enrollData=Object.values(enrollMonths).sort((a,b)=>a.month.localeCompare(b.month)).map(r=>({...r,rate:pct(r.compliant,r.total)}));
  return <div>
    <h2 className="section-title">Enrolment & Membership</h2>
    <div className="grid grid-3" style={{marginBottom:16}}>
      <div className="biz-kpi green"><div className="v">{BIZ.members.length.toLocaleString()}</div><div className="l">Total Members</div></div>
      <div className="biz-kpi"><div className="v">{pct(BIZ.members.filter(m=>m.uses_dis==='true'||m.uses_dis===true).length,BIZ.members.length)}%</div><div className="l">DIS Adoption</div></div>
      <div className="biz-kpi"><div className="v">{pct(BIZ.members.filter(m=>m.enrollment_compliant==='true'||m.enrollment_compliant===true).length,BIZ.members.length)}%</div><div className="l">On-time Enrolment</div></div>
    </div>
    <div className="grid grid-2"><div className="card"><h3>Age Distribution</h3><ResponsiveContainer width="100%" height={280}><BarChart data={ageData}><CartesianGrid strokeDasharray="3 3"/><XAxis dataKey="name"/><YAxis style={{fontSize:10}}/><Tooltip/><Bar dataKey="value" fill={COLORS[0]}/></BarChart></ResponsiveContainer></div>
    <div className="card"><h3>Income Brackets (HK$)</h3><ResponsiveContainer width="100%" height={280}><BarChart data={incomeData}><CartesianGrid strokeDasharray="3 3"/><XAxis dataKey="name" style={{fontSize:9}}/><YAxis style={{fontSize:10}}/><Tooltip/><Bar dataKey="value" fill={COLORS[1]}/></BarChart></ResponsiveContainer></div>
    <div className="card"><h3>Account Type Mix</h3><ResponsiveContainer width="100%" height={280}><PieChart><Pie data={acctData} dataKey="value" nameKey="name" outerRadius={90} label>{acctData.map((e,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}</Pie><Tooltip/><Legend/></PieChart></ResponsiveContainer></div>
    <div className="card"><h3>Enrolment Compliance Trend (60-day rule)</h3><ResponsiveContainer width="100%" height={280}><LineChart data={enrollData}><CartesianGrid strokeDasharray="3 3"/><XAxis dataKey="month" angle={-30} textAnchor="end" height={60} style={{fontSize:9}}/><YAxis domain={[0,100]} style={{fontSize:10}} tickFormatter={v=>v+'%'}/><Tooltip formatter={v=>v+'%'}/><Line type="monotone" dataKey="rate" stroke={COLORS[2]} strokeWidth={3}/></LineChart></ResponsiveContainer></div></div>
  </div>;
}

function BizClaimsPage(){
  const m={};BIZ.claims.forEach(c=>{m[c.claim_type]=m[c.claim_type]||{name:c.claim_type.replace(/_/g,' '),count:0,paid:0,amount:0};m[c.claim_type].count++;if(c.status==='PAID'){m[c.claim_type].paid++;m[c.claim_type].amount+=num(c.amount_paid);}});
  const data=Object.values(m).sort((a,b)=>b.count-a.count);
  const slaTrend={};BIZ.claims.forEach(c=>{const k=ymOf(c.submission_date);if(!k)return;slaTrend[k]=slaTrend[k]||{month:k,total:0,met:0,days:0,n:0};slaTrend[k].total++;if(c.sla_met==='true'||c.sla_met===true)slaTrend[k].met++;const d=parseInt(c.processing_days);if(!isNaN(d)){slaTrend[k].days+=d;slaTrend[k].n++;}});
  const slaData=Object.values(slaTrend).sort((a,b)=>a.month.localeCompare(b.month)).map(r=>({month:r.month,slaRate:pct(r.met,r.total),avgDays:r.n?Math.round(r.days/r.n):0}));
  const status={};BIZ.claims.forEach(c=>{status[c.status]=(status[c.status]||0)+1;});
  const statusData=Object.entries(status).map(([name,value])=>({name,value}));
  return <div>
    <h2 className="section-title">Claims & Withdrawals</h2>
    <div className="grid grid-2"><div className="card"><h3>Claims by Reason — Volume & Payout</h3><ResponsiveContainer width="100%" height={300}><BarChart data={data}><CartesianGrid strokeDasharray="3 3"/><XAxis dataKey="name" angle={-25} textAnchor="end" height={80} style={{fontSize:9}}/><YAxis yAxisId="l" style={{fontSize:10}}/><YAxis yAxisId="r" orientation="right" style={{fontSize:10}} tickFormatter={fmtHKD}/><Tooltip/><Legend/><Bar yAxisId="l" dataKey="count" fill={COLORS[0]} name="# Claims"/><Bar yAxisId="r" dataKey="amount" fill={COLORS[2]} name="Payout HK$"/></BarChart></ResponsiveContainer></div>
    <div className="card"><h3>Claim Status Distribution</h3><ResponsiveContainer width="100%" height={300}><PieChart><Pie data={statusData} dataKey="value" nameKey="name" outerRadius={100} label>{statusData.map((e,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}</Pie><Tooltip/><Legend/></PieChart></ResponsiveContainer></div>
    <div className="card" style={{gridColumn:'1/-1'}}><h3>30-Day SLA Adherence Trend</h3><ResponsiveContainer width="100%" height={280}><LineChart data={slaData}><CartesianGrid strokeDasharray="3 3"/><XAxis dataKey="month" angle={-30} textAnchor="end" height={60} style={{fontSize:9}}/><YAxis yAxisId="l" domain={[0,100]} style={{fontSize:10}} tickFormatter={v=>v+'%'}/><YAxis yAxisId="r" orientation="right" style={{fontSize:10}}/><Tooltip/><Legend/><Line yAxisId="l" type="monotone" dataKey="slaRate" stroke={COLORS[2]} strokeWidth={3} name="SLA Met %"/><Line yAxisId="r" type="monotone" dataKey="avgDays" stroke={COLORS[3]} strokeWidth={2} name="Avg Days"/></LineChart></ResponsiveContainer></div></div>
  </div>;
}

function BizCompliancePage(){
  const byType={};BIZ.compliance_cases.forEach(c=>{byType[c.case_type]=byType[c.case_type]||{name:c.case_type.replace(/_/g,' '),count:0,outstanding:0,surcharge:0};byType[c.case_type].count++;byType[c.case_type].outstanding+=num(c.outstanding_amount);byType[c.case_type].surcharge+=num(c.surcharge_amount);});
  const typeData=Object.values(byType);
  const repeat={};BIZ.employers.forEach(e=>{const c=parseInt(e.default_count_ltd)||0;if(c>0){repeat[e.employer_id]={id:e.employer_id,name:e.business_name,count:c,industry:e.industry,rating:e.compliance_rating};}});
  const top10=Object.values(repeat).sort((a,b)=>b.count-a.count).slice(0,10);
  const sevDist={};BIZ.compliance_cases.forEach(c=>{sevDist[c.severity||'?']=(sevDist[c.severity||'?']||0)+1;});
  const sevData=Object.entries(sevDist).map(([name,value])=>({name,value}));
  return <div>
    <h2 className="section-title">Compliance & Risk</h2>

function TrusteeScorecard(){
  const data=useMemo(()=>{
    const byTrustee={};
    BIZ.schemes.forEach(s=>{const t=s.trustee_name||'Unknown';if(!byTrustee[t])byTrustee[t]={trustee:t,schemes:[],aum:0,members:0,funds:0,onboarded:0,total:0,fers:[]};byTrustee[t].schemes.push(s);byTrustee[t].aum+=num(s.aum_hkb);byTrustee[t].members+=num(s.member_count);byTrustee[t].funds+=num(s.fund_count);byTrustee[t].total++;if(s.onboarding_status==='ONBOARDED'||s.onboarding_status==='COMPLETED')byTrustee[t].onboarded++;if(s.avg_fer_pct)byTrustee[t].fers.push(num(s.avg_fer_pct));});
    Object.values(byTrustee).forEach(t=>{
      const schemeIds={};t.schemes.forEach(s=>{schemeIds[s.scheme_id]=1;});
      const trsTr=BIZ.account_transfers.filter(x=>schemeIds[x.from_scheme_id]||schemeIds[x.to_scheme_id]);
      const completed=trsTr.filter(x=>x.status==='COMPLETED');
      const within7d=completed.filter(x=>num(x.processing_days)<=7).length;
      t.transferSlaPct=completed.length?Math.round(within7d/completed.length*100):0;
      t.transferVolume=trsTr.length;
      const claimsTr=BIZ.claims.filter(c=>{const m=BIZ.members.find(mm=>mm.member_id===c.member_id);return m&&schemeIds[m.scheme_id];});
      const claimsSla=claimsTr.filter(c=>c.sla_met==='true'||c.sla_met===true).length;
      t.claimSlaPct=claimsTr.length?Math.round(claimsSla/claimsTr.length*100):0;
      t.avgFer=t.fers.length?(t.fers.reduce((a,b)=>a+b,0)/t.fers.length).toFixed(2):'N/A';
      const slaScore=Math.min(t.transferSlaPct||100,t.claimSlaPct||100);
      t.status=t.onboarded<t.total?'gray':slaScore>=85?'green':slaScore>=70?'amber':'red';
      t.statusLabel=t.onboarded<t.total?'pending':slaScore>=85?'healthy':slaScore>=70?'watch':'action';
      const dates=t.schemes.map(s=>s.onboarding_date).filter(Boolean).sort();
      t.firstOnb=dates[0]?fmtDate(dates[0]):'N/A';
    });
    return Object.values(byTrustee).sort((a,b)=>b.aum-a.aum);
  },[]);
  const totals=useMemo(()=>{const aum=data.reduce((s,t)=>s+t.aum,0);const mem=data.reduce((s,t)=>s+t.members,0);const onb=data.reduce((s,t)=>s+t.onboarded,0);const tot=data.reduce((s,t)=>s+t.total,0);const green=data.filter(t=>t.status==='green').length;const amber=data.filter(t=>t.status==='amber').length;const red=data.filter(t=>t.status==='red').length;return {aum,mem,onb,tot,green,amber,red,n:data.length};},[data]);
  return <div>
    <h2 className="section-title">Trustee and Scheme Scorecard</h2>
    <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:16}}>Per-trustee operational health. Onboarding ascending by AUM size (eMPF policy). 12 trustees, 22 master plus 2 industry schemes.</div>
    <div className="grid grid-4" style={{marginBottom:16}}>
      <div className="mini-kpi"><div className="v">{totals.n}</div><div className="l">Trustees</div><div className="s">{totals.tot} schemes total</div></div>
      <div className="mini-kpi green"><div className="v">{totals.onb}/{totals.tot}</div><div className="l">Schemes Onboarded</div><div className="s">{Math.round(totals.onb/totals.tot*100)}% complete</div></div>
      <div className="mini-kpi"><div className="v">HK$ {totals.aum.toFixed(1)}B</div><div className="l">Total AUM Migrated</div><div className="s">{(totals.mem/1000).toFixed(0)}k members</div></div>
      <div className="mini-kpi"><div className="v">{totals.green} / {totals.amber} / {totals.red}</div><div className="l">Health Green / Amber / Red</div><div className="s">Composite of transfer plus claim SLAs</div></div>
    </div>
    <div className="tr-grid">{data.map(t=><div key={t.trustee} className={'tr-card '+t.status}><div className="thead"><div className="tname">{t.trustee}</div><div className={'tstatus '+t.status}>{t.statusLabel}</div></div><div className="tmeta">{t.total} scheme(s), onboarded from {t.firstOnb}</div><div className="tgrid"><div><div className="lbl">AUM</div><div className="val">HK$ {t.aum.toFixed(1)}B</div></div><div><div className="lbl">Members</div><div className="val">{t.members.toLocaleString()}</div></div><div><div className="lbl">Funds</div><div className="val">{t.funds}</div></div><div><div className="lbl">Avg FER</div><div className="val">{t.avgFer}%</div></div><div><div className="lbl">Transfer SLA 7d</div><div className="val" style={{color:t.transferSlaPct>=85?'#2c7a4d':t.transferSlaPct>=70?'#b8761d':'#b5352f'}}>{t.transferSlaPct}%</div></div><div><div className="lbl">Claim SLA met</div><div className="val" style={{color:t.claimSlaPct>=85?'#2c7a4d':t.claimSlaPct>=70?'#b8761d':'#b5352f'}}>{t.claimSlaPct}%</div></div></div></div>)}</div>
  </div>;
}

      <div className="card"><h3>Service Channel Performance</h3><table style={{marginTop:8,fontSize:12}}><thead><tr><th>Channel</th><th>Volume</th><th>Performance</th><th>Pledge</th></tr></thead><tbody>{channels.map((c,i)=><tr key={i}><td style={{fontSize:11.5}}>{c.n}</td><td style={{fontSize:11}}>{c.vol}</td><td style={{fontSize:11.5,fontWeight:600}}>{c.avg}</td><td style={{fontSize:10.5,color:'var(--text-muted)'}}>{c.pledge}</td></tr>)}</tbody></table></div>

}

function CostSavingsTracker(){
  const monthsElapsed=22;const totalMonths=120;
  const savingsTarget=50;const lowBand=40;
  const targetSavings=savingsTarget*(monthsElapsed/totalMonths);
  const lowSavings=lowBand*(monthsElapsed/totalMonths);
  const points=[];
  for(let m=0;m<=monthsElapsed+24;m+=3){
    const yr=2024+Math.floor((m+6)/12);const q=Math.floor(((m+6)%12)/3+1);
    const lbl=yr+'-Q'+q;
    const lo=lowBand*(m/120);const tg=savingsTarget*(m/120);
    const actual=m<=monthsElapsed?+(tg*1.04).toFixed(2):null;
    points.push({label:lbl,low:+lo.toFixed(2),target:+tg.toFixed(2),actual});
  }
  const baselineFee=580;const launchFee=370;const currentFee=290;
  const reductionPct=Math.round((baselineFee-currentFee)/baselineFee*100);
  const launchReductionPct=Math.round((baselineFee-launchFee)/baselineFee*100);
  return <div>
    <h2 className="section-title">Cost Savings and Public Value Tracker</h2>
    <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:16}}>Tracking the revised <strong>HK$50B</strong> 10-year cumulative savings target (upgraded by MPFA/FSTB in 2025 following full onboarding and the further fee cut effective 1 Apr 2026). HK$40B retained as downside band. Sources: FSTB blog 24 Jun 2024, MPFA/FSTB 2025-26 communications.</div>
    <div className="cost-hero">
      <div>
        <div><span className="num">{targetSavings.toFixed(2)}</span><span className="unit"> HK$ B</span></div>
        <div className="lbl">Cumulative Savings (revised target basis, today)</div>
        <div style={{fontSize:13,color:'var(--text-secondary)',marginTop:8,lineHeight:1.6}}>Per MPFA, the platform delivered ~36% admin fee reduction in Years 1-2, with a further cut to <strong>29 bps</strong> effective 1 Apr 2026, and trending toward 20-25 bps by Year 10. Revised cumulative savings target: <strong>HK$50B</strong> for ~4.75M scheme members.</div>
      </div>
      <div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:11.5,color:'var(--text-secondary)'}}><span><strong>HK$ {targetSavings.toFixed(1)}B</strong> on target-basis trajectory</span><span>HK$50B target by 2034</span></div>
        <div className="pgress"><div className="fill" style={{width:Math.min(100,targetSavings/savingsTarget*100)+'%'}}/></div>
        <div className="marks"><span>2024</span><span>Y2</span><span>Y4</span><span>Y6</span><span>Y8</span><span>2034</span></div>
        <div style={{marginTop:14,fontSize:12.5,color:'var(--text-secondary)'}}>Downside band (HK$40B): <strong>HK$ {lowSavings.toFixed(1)}B</strong>. Months elapsed: <strong>{monthsElapsed}</strong> of 120 ({Math.round(monthsElapsed/120*100)}%).</div>
      </div>
    </div>
    <div className="grid grid-3" style={{marginBottom:16}}>
      <div className="mini-kpi green"><div className="v">~{reductionPct}%</div><div className="l">Admin Fee Reduction vs pre-eMPF baseline</div><div className="s">HK${baselineFee} → HK${launchFee} (launch, -{launchReductionPct}%) → HK${currentFee} (1 Apr 2026, 29 bps)</div></div>
      <div className="mini-kpi"><div className="v">20-25 bps</div><div className="l">Target FER by Year 10</div><div className="s">vs ~85 bps pre-eMPF · 29 bps as of Apr 2026</div></div>
      <div className="mini-kpi"><div className="v">HK$ 33.2B</div><div className="l">Govt SP/LSP Subsidy (25 yr)</div><div className="s">2021 prices, post-offsetting transition</div></div>
    </div>
    <div className="card" style={{marginBottom:16}}><h3>Cumulative Savings Trajectory</h3><ResponsiveContainer width="100%" height={300}><ComposedChart data={points}><CartesianGrid strokeDasharray="3 3"/><XAxis dataKey="label" angle={-30} textAnchor="end" height={60} style={{fontSize:10}}/><YAxis style={{fontSize:10}}/><Tooltip/><Legend/><Area type="monotone" dataKey="target" stroke={COLORS[1]} fill={COLORS[1]} fillOpacity={0.15} name="HK$50B target"/><Area type="monotone" dataKey="low" stroke={COLORS[0]} fill={COLORS[0]} fillOpacity={0.08} name="HK$40B downside"/><Line type="monotone" dataKey="actual" stroke={COLORS[2]} strokeWidth={3} dot={{r:3}} name="Estimated actual"/></ComposedChart></ResponsiveContainer></div>
    <div className="callout"><h3>Where the savings come from</h3><ul><li><strong>Standardisation</strong> — single platform replaces 12 trustee admin systems</li><li><strong>Automation</strong> — 100k plus paper transactions per day eliminated; bulk cheques retired</li><li><strong>Straight pass-on rule</strong> — under MPF legislation, every dollar of platform efficiency must flow to scheme members as fee reductions</li><li><strong>Account consolidation</strong> — members consolidate multiple personal accounts</li></ul></div>
  </div>;
}

function DevDashboard({section}){
  const WEEKS=(window.QA&&window.QA.WEEKS)||[];
  const WEEK_DATES=(window.QA&&window.QA.WEEK_DATES)||{};
  const [week,setWeek]=useState('W22');
  const html=useMemo(()=>{
    if(!window.QA)return '<div class="card" style="padding:var(--space-xl);color:var(--accent-danger)">QA render module not loaded.</div>';
    return window.QA.render(section,week,'en');
  },[section,week]);
  const weekIdx=WEEKS.indexOf(week);
  const label=`Week ${week.slice(1)} — ${WEEK_DATES[week]||''}`;
  return <div className="content qa-embed">
    <div className="qa-week-selector">
      <button className="qa-week-nav" onClick={()=>weekIdx>0&&setWeek(WEEKS[weekIdx-1])} disabled={weekIdx<=0}>◀</button>
      <div className="qa-week-label">{label}</div>
      <button className="qa-week-nav" onClick={()=>weekIdx<WEEKS.length-1&&setWeek(WEEKS[weekIdx+1])} disabled={weekIdx>=WEEKS.length-1}>▶</button>
      <div className="qa-week-pills">
        {WEEKS.map(w=><button key={w} className={`qa-week-pill ${w===week?'active':''}`} onClick={()=>setWeek(w)}>{w}</button>)}
      </div>
    </div>
    <div dangerouslySetInnerHTML={{__html:html}}/>
  </div>;
}
